<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>日常 · 健康生活</title>
<script src="./data/decks.js"></script>
<script src="./data/valve.js"></script>
<script src="./data/thinking.js"></script>
<script src="./data/scenes.js"></script>
<style>
:root{
  --brand:#4f46e5;--brand2:#7c3aed;--sub:#6b7280;--ok:#059669;--warn:#b45309;--err:#dc2626;
  --accent:#1FBFA9;--accent2:#5FD9C4;--accent-soft:#E7F9F5;
  --hot:#FF6B5B;--hot2:#FFA36B;--hot-soft:#FFF0EC;
  --purple:#8B7CF6;--purple2:#B39BFF;--purple-soft:#F1EEFF;
  --blue:#4A9EFF;--blue2:#7FC4FF;--blue-soft:#EAF3FF;
  --pink:#FF6FA5;--pink2:#FFA1C4;--pink-soft:#FFEEF5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#e9ebf3;color:#111827;display:flex;justify-content:center;min-height:100dvh;overflow:hidden;}
.phone{position:relative;width:100%;max-width:460px;height:100dvh;background:linear-gradient(180deg,#fbfbfe,#f3f4fa);display:flex;flex-direction:column;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 0 0 4px rgba(79,70,229,.12);}
.today{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;}
.top-icon-btn{border:0;background:#fff;width:34px;height:34px;border-radius:11px;font-size:15px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.06);}
#view{flex:1;overflow-y:auto;padding:2px 16px 90px;}
#view::-webkit-scrollbar{width:0;}
.tabbar{flex-shrink:0;display:flex;background:rgba(255,255,255,.95);border-top:1px solid rgba(0,0,0,.06);padding:8px 2px calc(8px + env(safe-area-inset-bottom));}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;border-radius:12px;cursor:pointer;color:#9aa0b0;font-size:9.5px;font-weight:600;font-family:inherit;}
.tab.on{color:var(--brand);}
.tab-icon{font-size:16px;line-height:1;}

.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid rgba(16,24,40,.045);box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 22px -14px rgba(16,24,40,.28);}
.card.done{background:#f8f9fd;border-style:dashed;opacity:.72;}
.hero{padding:4px 4px 14px;}
.hero-k{font-size:12px;color:var(--brand);font-weight:700;letter-spacing:.5px;margin-bottom:7px;}
.hero h1{font-size:22px;margin:0;letter-spacing:-.5px;}
.sec-title{font-size:13px;font-weight:700;color:#3b4256;margin:18px 4px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.sec-title .muted{font-weight:500;font-size:11.5px;display:flex;align-items:center;gap:6px;}
.muted{color:var(--sub);}
.foot-note{text-align:center;font-size:11.5px;color:#aab0c0;padding:18px 0 4px;}
.btn{border:0;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:650;cursor:pointer;font-family:inherit;}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px -10px rgba(79,70,229,.9);}
.btn.wide{width:100%;margin-top:6px;}
.btn.ghost{background:#f1f2f9;color:#4b5265;padding:8px 14px;font-size:13px;}
.btn.danger{background:#fef2f2;color:#dc2626;padding:8px 14px;font-size:13px;}
.btn-primary{width:100%;border:none;font-family:inherit;font-size:15px;font-weight:600;color:#fff;padding:15px;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-top:4px;}
.btn-ghost-h{width:100%;border:none;font-family:inherit;font-size:14px;font-weight:600;padding:13px;border-radius:14px;cursor:pointer;background:var(--accent-soft);color:var(--accent);}
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px -16px;padding:6px 16px 12px;flex-wrap:nowrap;}
.chips::-webkit-scrollbar{display:none;}
.chip{border:1px solid #e6e8f0;background:#fff;color:#5b6276;padding:8px 15px;border-radius:99px;font-size:13.5px;font-weight:650;white-space:nowrap;cursor:pointer;flex-shrink:0;font-family:inherit;}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.subtabs{display:flex;gap:5px;background:#fff;border-radius:14px;padding:5px;margin-bottom:12px;border:1px solid rgba(16,24,40,.05);overflow-x:auto;}
.subtabs::-webkit-scrollbar{display:none;}
.subtab{border:0;background:none;padding:9px 12px;border-radius:10px;font-size:12.5px;font-weight:650;color:#7a8194;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;}
.subtab.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;}
.tip-card{background:#fff;border:1px dashed #dfe2ee;border-radius:16px;padding:14px;font-size:12.5px;line-height:1.7;color:#5b6276;margin-top:4px;}
.loading-card{background:#fff;border-radius:18px;padding:32px 20px;text-align:center;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
.err-inline{background:#fef3c7;border:1px solid #fde68a;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.7;color:#92400e;margin-top:8px;}
.src-tag{display:inline-block;font-size:10.5px;font-weight:750;padding:2px 8px;border-radius:5px;margin-bottom:8px;background:#eef0ff;color:var(--brand);}
.sk{background:linear-gradient(90deg,#eef0f7 25%,#f7f8fc 37%,#eef0f7 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:18px;margin-bottom:12px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

.home-head{background:#fff;border-radius:20px;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 22px -14px rgba(16,24,40,.28);}
.home-head .left .title{font-size:24px;font-weight:800;letter-spacing:.5px;color:#1B1F2A;}
.home-head .left .suggest{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.65;max-width:230px;}
.home-head .right{text-align:right;flex:none;}
.home-head .right .date{font-size:14px;font-weight:700;}
.home-head .right .weather{font-size:13px;color:#5A6175;margin-top:8px;}
.home-head .right .temp{font-size:12.5px;color:var(--sub);margin-top:3px;}
.home-tl-wrap{background:#fff;border-radius:18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 22px -14px rgba(16,24,40,.28);overflow:hidden;}
.home-tl-item{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;transition:background .15s;cursor:pointer;}
.home-tl-item:active{background:#f5fbfa;}
.home-tl-item:not(:last-child)::after{content:'';position:absolute;left:29px;bottom:-6px;width:1.5px;height:14px;background:#E6E9F1;}
.home-tl-text{flex:1;font-size:13.5px;color:#1B1F2A;line-height:1.5;min-width:0;}
.home-tl-text .tm{color:var(--sub);font-size:11.5px;font-weight:600;margin-right:8px;}
.home-tl-text .sub{color:var(--sub);font-size:11.5px;display:block;margin-top:2px;line-height:1.45;}
.home-tl-arrow{color:var(--accent);font-size:16px;flex:none;opacity:.55;}
.home-tl-badge{font-size:10px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;font-weight:700;flex:none;}
.home-tl-item.is-done .home-tl-text{color:var(--sub);}
.check{width:22px;height:22px;border-radius:50%;border:2px solid #E3E6EF;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer;transition:.2s;}
.check.done{background:var(--accent);border-color:var(--accent);}
.check.done::after{content:'✓';}

.body-state-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.body-state-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;border-radius:12px;background:#F7F8FC;border:1.5px solid transparent;cursor:pointer;font-size:11.5px;font-weight:600;color:#3A4152;text-align:center;line-height:1.25;transition:.15s;}
.body-state-item .bsi-icon{font-size:20px;line-height:1;}
.body-state-item .bsi-label{font-size:11px;font-weight:600;white-space:nowrap;}
.body-state-item.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.body-state-item.active .bsi-label{color:var(--accent);font-weight:700;}

.task-card{background:linear-gradient(135deg,#fff,#f8f9fd);border:1px solid rgba(79,70,229,.12);border-radius:18px;padding:16px;margin-bottom:14px;}
.task-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.task-title{font-size:14px;font-weight:750;}
.task-progress{font-size:12px;color:var(--sub);font-weight:600;}
.task-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #eceef4;cursor:pointer;}
.task-row:last-child{border:0;}
.task-check{width:22px;height:22px;border-radius:8px;border:2px solid #dfe2ee;background:#fff;display:grid;place-items:center;font-size:12px;flex-shrink:0;color:#fff;font-weight:700;}
.task-check.on{background:var(--brand);border-color:var(--brand);}
.task-label{flex:1;font-size:13px;font-weight:600;color:#3f4658;}
.task-label.on{color:#aab0c0;text-decoration:line-through;}
.task-count{font-size:11.5px;color:var(--sub);font-weight:600;}
.review-entry{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;border-radius:18px;padding:14px;margin-bottom:14px;}
.review-entry .r-title{font-size:13.5px;font-weight:750;color:#92400e;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;}
.review-entry .r-meta{font-size:12px;color:#a16207;line-height:1.7;margin-bottom:10px;}
.streak-badge{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;font-size:10.5px;font-weight:750;padding:2px 7px;border-radius:99px;}
.know-q{font-size:15.5px;font-weight:750;line-height:1.5;}
.know-a{font-size:13.5px;line-height:1.78;color:#3f4658;margin-top:12px;padding-top:12px;border-top:1px dashed #eceef4;}
.know-key{margin-top:12px;background:#f8f9fd;border-left:3px solid var(--brand);padding:11px 13px;border-radius:0 10px 10px 0;font-size:12.5px;line-height:1.75;color:#4b5265;}
.know-body{display:none;margin-top:12px;}
.know.open .know-body{display:block;}
.know-cat{display:inline-block;font-size:11px;font-weight:700;color:var(--brand);background:#eef0ff;padding:3px 9px;border-radius:6px;margin-bottom:10px;}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e6e8f0;border-radius:14px;padding:10px 14px;margin:8px 0 4px;}
.search-input{flex:1;border:0;outline:0;background:transparent;font-size:14px;padding:2px 0;font-family:inherit;}
.word-mini{background:#fff;border:1px solid rgba(16,24,40,.06);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:8px;}
.word-mini.done{background:#f8f9fd;opacity:.65;border-style:dashed;}
.word-mini .wm-word{font-size:15px;font-weight:750;color:#2b3244;flex-shrink:0;}
.word-mini.done .wm-word{text-decoration:line-through;color:#aab0c0;}
.word-mini .wm-cn{font-size:12px;color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.word-mini .wm-check{width:22px;height:22px;border-radius:50%;border:2px solid #dfe2ee;background:#fff;display:grid;place-items:center;font-size:11px;flex-shrink:0;color:#fff;font-weight:700;}
.word-mini .wm-check.on{background:var(--brand);border-color:var(--brand);}
.word-big{font-size:32px;font-weight:850;letter-spacing:-.8px;color:#2b3244;}
.word-ph{font-size:13px;color:var(--sub);margin-top:6px;}
.deck-chip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:#fff;border:1px solid #e6e8f0;border-radius:14px;padding:11px 14px;cursor:pointer;flex-shrink:0;min-width:130px;text-align:left;font-family:inherit;}
.deck-chip.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;}
.deck-chip .dc-name{font-size:13.5px;font-weight:750;}
.deck-chip .dc-meta{font-size:11px;opacity:.7;}
.progress-bar{height:8px;background:#e5e7f5;border-radius:99px;overflow:hidden;margin-top:10px;}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .4s;}
.load-more{border:0;background:#f1f2f9;color:#4b5265;width:100%;padding:13px;border-radius:12px;font-size:13px;font-weight:650;cursor:pointer;margin-top:6px;font-family:inherit;}
.answer-input{width:100%;min-height:80px;border:1px solid #e6e8f0;border-radius:12px;padding:12px;font-size:14px;line-height:1.7;resize:vertical;background:#fafbfe;margin-top:6px;font-family:inherit;}
.score-card{background:#fff;border:1px solid #e2e5ff;border-radius:16px;padding:16px;margin-top:14px;}
.score-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.score-num{font-size:34px;font-weight:850;color:var(--brand);letter-spacing:-1.5px;line-height:1;}
.score-label{font-size:12px;font-weight:700;color:var(--brand);}
.score-row{margin-top:12px;padding-top:12px;border-top:1px dashed #eceef4;}
.score-row-title{font-size:12px;font-weight:750;margin-bottom:8px;}
.score-extra{background:#f8f9fd;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.78;color:#4b5265;}
.score-list{margin:0;padding-left:18px;}
.score-list li{font-size:13px;line-height:1.75;color:#3f4658;}
.rate-row{display:flex;gap:8px;margin-top:14px;}
.rate-btn{flex:1;border:0;padding:12px 4px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.rate-btn.again{background:#fef2f2;color:#dc2626;}
.rate-btn.hard{background:#fef3c7;color:#b45309;}
.rate-btn.good{background:#ecfdf5;color:#047857;}

.h-task{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid #F3F5F9;}
.h-task:last-child{border-bottom:none;padding-bottom:0;}
.h-task .body{flex:1;min-width:0;}
.h-t-name{font-size:14px;font-weight:500;}
.tag{font-size:11px;padding:3px 9px;border-radius:9px;background:#F3F5F9;color:#7A8196;font-weight:500;}
.tag.on{background:var(--accent-soft);color:var(--accent);}
.progress{height:8px;border-radius:8px;background:#F0F2F7;overflow:hidden;margin:2px 0 9px;}
.progress .bar{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.row-between{display:flex;justify-content:space-between;align-items:center;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.stat{background:#fff;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 22px -14px rgba(16,24,40,.28);}
.stat .v{font-size:18px;font-weight:700;}
.stat .k{font-size:11px;color:var(--sub);margin-top:5px;}
.stat .d{font-size:10px;color:var(--sub);margin-top:3px;font-weight:600;}
.tl{position:relative;padding-left:24px;}
.tl::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:#EDF0F6;}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:'';position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #DDE2EC;box-sizing:border-box;}
.tl-item.done::before{background:var(--accent);border-color:var(--accent);}
.tl-time{font-size:11px;color:var(--sub);margin-bottom:3px;font-weight:500;}
.tl-title{font-size:14px;font-weight:500;}
.tl-item.done .tl-title{text-decoration:line-through;color:var(--sub);}
.tl-desc{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.55;}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-head .m{font-size:15px;font-weight:700;}
.cal-head span.nav{color:#B9C0D0;font-size:17px;cursor:pointer;padding:0 6px;}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-week div{text-align:center;font-size:11px;color:#A3A9B8;padding:4px 0;font-weight:500;}
.cal-grid div{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;border-radius:10px;position:relative;color:#3A4152;cursor:pointer;user-select:none;padding:2px 0;}
.cal-grid div.empty{visibility:hidden;cursor:default;}
.cal-grid div.sel{background:var(--blue-soft);color:var(--blue);font-weight:600;}
.cal-grid div.today{background:var(--blue);color:#fff;font-weight:700;}
.cal-grid div.has::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--blue);opacity:.75;}
.cal-grid div.today.has::after{background:#fff;opacity:1;}
.cal-grid div.holiday{color:var(--hot);font-weight:700;}
.cal-grid div.holiday .holiday-name{font-size:8px;line-height:1;margin-top:1px;font-weight:500;color:var(--hot);}
.cal-grid div.today.holiday .holiday-name{color:#fff;}

.balance{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:20px;padding:20px;margin-bottom:12px;}
.balance .lab{font-size:12px;opacity:.85;}
.balance .big{font-size:30px;font-weight:700;margin-top:8px;}
.balance .foot{display:flex;gap:26px;margin-top:16px;font-size:11.5px;opacity:.92;}
.mic-wrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 20px;}
.mic{width:104px;height:104px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(145deg,var(--accent2),var(--accent));font-size:40px;color:#fff;transition:.2s;}
.mic.listening{animation:pulseMic 1.4s infinite;box-shadow:0 0 0 6px rgba(31,191,169,.15);}
@keyframes pulseMic{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.mic-hint{margin-top:16px;font-size:12.5px;color:var(--sub);text-align:center;padding:0 20px;line-height:1.6;}
.text-input-area{display:none;margin-top:10px;width:100%;}
.text-input-area.show{display:block;}
.text-input-area input{width:100%;border:1.5px solid #E3E6EF;border-radius:12px;padding:12px 14px;font-family:inherit;font-size:13.5px;outline:none;margin-bottom:8px;}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F3F5F9;cursor:pointer;border-radius:8px;}
.tx:hover{background:#FAFBFC;}
.tx:last-child{border-bottom:none;padding-bottom:0;}
.tx .ic{width:38px;height:38px;border-radius:12px;background:#F5F7FB;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;}
.tx .body{flex:1;min-width:0;}
.tx .amt{font-weight:600;font-size:14px;margin-left:8px;}
.tx .amt.inc{color:var(--accent);}
.tx .del-tx{width:24px;height:24px;border-radius:50%;border:none;background:#FFEDEA;color:var(--hot);font-size:12px;cursor:pointer;flex:none;line-height:1;}
.cat-chip{font-size:11.5px;padding:6px 12px;border-radius:10px;background:#F3F5F9;color:#5A6175;font-weight:500;cursor:pointer;border:none;font-family:inherit;margin:2px;display:inline-block;}
.cat-chip.active{background:var(--accent);color:#fff;}
.cat-chip.newcat{background:var(--blue-soft);color:var(--blue);}

.sport-timer{font-size:40px;font-weight:700;color:var(--accent);text-align:center;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;margin:4px 0 2px;line-height:1.1;}
.sport-timer-sub{text-align:center;font-size:12px;color:var(--sub);margin-bottom:4px;}
.sport-meta{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:12px;color:#5A6175;flex-wrap:wrap;}
.sport-meta b{color:#1B1F2A;font-weight:700;}
.sport-done-badge{display:inline-block;margin-top:10px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;}

const DAY = Math.floor((Date.now() + 8*3600*1000) / 86400000);
const DAILY_WORD_COUNT = 5, DAILY_VALVE_COUNT = 5, REVIEW_TARGET = 5, PAGE_SIZE = 50;
const WEEK_CN = '日一二三四五六';

function bjDate(){ return new Date(Date.now() + 8*3600*1000); }
function fmtDate(){ const d = bjDate(); return (d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日 星期'+WEEK_CN[d.getUTCDay()]; }
function todayStr(){ const d = bjDate(); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function prevDayStr(){ const d = new Date(Date.now()-86400000+8*3600*1000); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function localDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtShort(d){ return (d.getMonth()+1)+'/'+d.getDate(); }

const LS = {
  get(k,d){ try { const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); } catch(e){ return d; } },
  set(k,v){ try { localStorage.setItem(k,JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dailyPick(arr,n,salt=0){
  if(!arr||!arr.length) return [];
  let seed=(DAY*1000+salt*7919)%2147483647;
  if(seed<=0) seed+=2147483646;
  const rnd=()=>{seed=(seed*16807)%2147483647; return (seed-1)/2147483646;};
  const idx=arr.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx.slice(0,n).map(i=>arr[i]);
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function raceTimeout(promise, ms, errMsg='请求超时'){
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error(errMsg)), ms))]);
}
function friendlyErr(e){
  const msg = (e && e.message) ? e.message : String(e || '');
  if (/Failed to fetch/i.test(msg)) return '网络不通';
  if (/aborted|timeout|请求超时/i.test(msg)) return '请求超时';
  if (/HTTP 404/.test(msg)) return 'HTTP 404';
  if (/HTTP 429/.test(msg)) return '请求过于频繁';
  if (/HTTP 403/.test(msg)) return '无权限';
  if (/code=130/.test(msg)) return 'QPS 超限（稍后重试）';
  if (/code=140/.test(msg)) return '接口未申请';
  if (/无内容/.test(msg)) return '接口返回空';
  return msg || '失败';
}
async function fetchJson(url, timeout=8000){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try { const r = await fetch(url, { signal: controller.signal }); if (!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally { clearTimeout(timer); }
}
async function fetchText(url, timeout=8000){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try { const r = await fetch(url, { signal: controller.signal }); if (!r.ok) throw new Error('HTTP '+r.status); return await r.text(); }
  finally { clearTimeout(timer); }
}
function extractList(result){
  if (!result) return [];
  if (Array.isArray(result)) return result;
  if (Array.isArray(result.newslist)) return result.newslist;
  if (Array.isArray(result.list)) return result.list;
  if (result.title || result.content || result.description || result.en) return [result];
  return [];
}

  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;

  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 1900);
}

const TianapiQueue = {
  _lastTs: 0,
  _tail: Promise.resolve(),
  _pending: 0,
  async run(fn){
    this._pending++;
    const prev = this._tail;
    let release;
    this._tail = new Promise(r => { release = r; });
    try {
      await prev.catch(() => {});
      const now = Date.now();
      const wait = Math.max(0, 1200 - (now - this._lastTs));
      if (wait > 0) await new Promise(r => setTimeout(r, wait));
      try { return await fn(); }
      finally { this._lastTs = Date.now(); }
    } finally {
      this._pending--;
      release();
    }
  }
};
async function tianapiFetch(url, timeout=8000){
  return await TianapiQueue.run(async () => {
    return await raceTimeout(fetchJson(url, timeout), timeout + 1000);
  });
}

const DeckLoader = {
  loaded:{}, loading:{},
  load(deckId){
    if (this.loaded[deckId]) return Promise.resolve(this.loaded[deckId]);
    if (this.loading[deckId]) return this.loading[deckId];
    if (window.__WORD_DECK_DATA && window.__WORD_DECK_DATA[deckId]){
      const words = window.__WORD_DECK_DATA[deckId].map(w => ({ ...w, deck: deckId }));
      this.loaded[deckId] = words; return Promise.resolve(words);
    }
    const meta = SEED.DECKS.find(d => d.id === deckId);
    if (!meta || !meta.file){ this.loaded[deckId] = []; return Promise.resolve([]); }
    this.loading[deckId] = new Promise(resolve => {
      const s = document.createElement('script'); s.src = meta.file;
      s.onload = () => { const raw = (window.__WORD_DECK_DATA && window.__WORD_DECK_DATA[deckId]) || []; const words = raw.map(w => ({ ...w, deck: deckId })); this.loaded[deckId] = words; resolve(words); };
      s.onerror = () => { this.loaded[deckId] = []; resolve([]); };
      document.head.appendChild(s);
    });
    return this.loading[deckId];
  },
  allLoaded(){ return !SEED.DECKS.length || SEED.DECKS.every(d => this.loaded[d.id] !== undefined); },
  get(deckId){
    if (deckId === 'all'){ const all = []; SEED.DECKS.forEach(d => { const w = this.loaded[d.id]; if (Array.isArray(w)) all.push(...w); }); return all; }
    return this.loaded[deckId] || [];
  },
  findWord(wordStr){
    const map = LS.get('word-deck-map', {}); const deckId = map[wordStr];
    if (deckId && this.loaded[deckId]){ const found = this.loaded[deckId].find(w => w.w === wordStr); if (found) return found; }
    for (const id in this.loaded){ const found = (this.loaded[id] || []).find(w => w.w === wordStr); if (found) return found; }
    return null;
  },
  async ensureForReview(){
    const map = LS.get('word-deck-map', {}); const ids = new Set(Object.values(map));
    if (!ids.size){ for (const d of SEED.DECKS) await this.load(d.id).catch(()=>[]); return; }
    await Promise.all([...ids].map(id => this.load(id).catch(() => [])));
  }
};

function analyzeIngredients(name, ingrText){
  const reasons = []; let level = 'ok';
  const setLevel = (lv, reason) => { if (lv === 'avoid') level = 'avoid'; else if (lv === 'caution' && level !== 'avoid') level = 'caution'; if (reason) reasons.push(reason); };
  const t = ingrText || '';
  if (/过氧化苯甲酰|benzoyl/i.test(t)){ if (profile.sensitivity === '高') setLevel('avoid','含过氧化苯甲酰，敏感肌建议避免'); else if (profile.sensitivity === '中') setLevel('caution','含过氧化苯甲酰，建议仅局部点涂'); else reasons.push('含过氧化苯甲酰，适合痘痘期局部使用'); }
  if (/壬二酸|azelaic/i.test(t)){ if (profile.sensitivity === '高') setLevel('caution','含壬二酸，敏感肌需先建立耐受'); else setLevel('caution','含壬二酸，初期可能刺痒，建议隔天开始'); }
  if (/烟酰胺|niacinamide/i.test(t)){ if (profile.sensitivity === '高') setLevel('caution','含烟酰胺，敏感肌可能刺痛，需建立耐受'); else reasons.push('含烟酰胺，有助于控油、提亮、修护屏障'); }
  if (/抗坏血酸|ascorbic|维c|乙基/i.test(t)){ if (profile.sensitivity === '高') setLevel('caution','含维C衍生物，敏感肌需逐步建立耐受'); else reasons.push('含维C成分，抗氧化、提亮肤色'); }
  if (/视黄醇|retinol|胜肽|peptide|多肽/i.test(t)){ if (profile.sensitivity === '高') setLevel('caution','含抗老活性成分，敏感肌需先建立耐受，建议夜间使用'); else reasons.push('含抗老成分，适合夜间护理'); }
  if (/神经酰胺|泛醇|积雪草|透明质酸|角鲨烷|胆固醇/i.test(t)) reasons.push('含修复屏障成分，适合日常维持与敏感期');
  if (/变性乙醇|酒精|alcohol\s*denat/i.test(t)){ if (profile.sensitivity === '高') setLevel('caution','含酒精，敏感肌慎用'); else if (profile.skinType === '干性') setLevel('caution','含酒精，干皮使用可能加重干燥'); }
  if (level === 'ok' && !reasons.length) reasons.push('未检测到明显风险成分，可尝试使用');
  return { level, reasons };
}

function calcShape(){
  const s = body.shoulder, w = body.waist, h = body.hip;
  const whr = w / h, shr = s / h;
  if (whr <= 0.76) {
    if (Math.abs(shr - 1) < 0.06) return { name:'沙漏型', desc:'肩臀接近，腰线明显' };
    if (shr > 1.06) return { name:'倒三角型', desc:'肩部较宽，腰线明显' };
    return { name:'梨形', desc:'臀胯较宽，腰线明显' };
  }
  if (shr >= 1.06) return { name:'倒三角型', desc:'肩部偏宽，腰线平缓' };
  if (h - s >= 6) return { name:'梨形', desc:'臀胯偏宽，腰线平缓' };
  return { name:'矩形', desc:'肩腰臀比例接近' };
}

function fitEase(ease, soft, hard){
  if (ease < -hard) return { k:'tight', t:'偏紧', color:'#FF6B5B', bg:'#FFEDEA' };
  if (ease < -soft) return { k:'slight-tight', t:'略紧', color:'#D98A0B', bg:'#FFF4E0' };
  if (ease <= soft) return { k:'ok', t:'合身', color:'#1FBFA9', bg:'#E7F9F5' };
  if (ease <= hard) return { k:'slight-loose', t:'略松', color:'#4A9EFF', bg:'#EAF3FF' };
  return { k:'loose', t:'偏松', color:'#8B7CF6', bg:'#F1EEFF' };
}

      else if (diff < -10) fit = { k:'loose', t:'偏短', color:'#8B7CF6', bg:'#F1EEFF' };
      else fit = { k:'slight-loose', t:'略短', color:'#4A9EFF', bg:'#EAF3FF' };

      if (diff > 12) suggests.push('衣长偏长，建议搭高腰下装并塞入衣角。');
      else if (diff < -10) suggests.push('衣长偏短，会露出腰腹，建议搭高腰下装。');
    }
    if (shape.name === '梨形') suggests.push('梨形身材：上半身可穿亮色、有设计感的款式。');
    if (shape.name === '倒三角型') suggests.push('倒三角型：避免大垫肩，V 领柔化肩线。');
    if (shape.name === '沙漏型') suggests.push('沙漏型：收腰款最显身材。');
    if (shape.name === '矩形') suggests.push('矩形：腰带、短上衣+高腰下装制造腰线。');
  }
  if (sizeType === 'pants'){
    if (g.waist){ const e = g.waist - body.waist; rows.push({ label:'腰围松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,2,5) }); }
    if (g.hip){ const e = g.hip - body.hip; rows.push({ label:'臀围松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,2.5,6) }); }
    if (g.length){
      const ideal = (body.inseam || body.legLength * 0.75) + 3;
      const diff = g.length - ideal;
      let fit;
      if (Math.abs(diff) <= 4) fit = { k:'ok', t:'理想', color:'#1FBFA9', bg:'#E7F9F5' };
      else if (diff > 8) fit = { k:'tight', t:'偏长', color:'#FF6B5B', bg:'#FFEDEA' };
      else if (diff > 4) fit = { k:'slight-tight', t:'略长', color:'#D98A0B', bg:'#FFF4E0' };
      else if (diff < -8) fit = { k:'loose', t:'偏短', color:'#8B7CF6', bg:'#F1EEFF' };
      else fit = { k:'slight-loose', t:'略短', color:'#4A9EFF', bg:'#EAF3FF' };
      rows.push({ label:'裤长参考', value:`标称 ${g.length} cm（理想 ${Math.round(ideal)} cm）`, fit });
      if (diff > 8) alerts.push(`裤长比理想值长约 ${Math.round(diff)} cm，容易拖地。建议搭配约 ${Math.round(3 + (diff - 3))} cm 高的鞋子。`);
      else if (diff < -8) alerts.push(`裤长短 ${Math.abs(Math.round(diff))} cm，会露出脚踝以上。`);
    }
    if (shape.name === '梨形') suggests.push('梨形身材：直筒或微喇裤更友好。');
    if (shape.name === '倒三角型') suggests.push('倒三角型：阔腿裤或直筒裤平衡上下身。');
    if (shape.name === '矩形') suggests.push('矩形：高腰+微喇裤营造曲线。');
  }
  if (sizeType === 'shoes'){
    if (g.footLength){ const e = g.footLength - body.footLength; rows.push({ label:'脚长松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,0.4,0.9) }); }
    if (g.footWidth){ const e = g.footWidth - body.footWidth; rows.push({ label:'脚宽松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,0.3,0.7) }); }
    suggests.push('鞋头偏尖或偏圆可延伸腿线。');
  }
  const hardTight = rows.filter(r => r.fit.k === 'tight' || r.fit.k === 'loose').length;
  const softDiff = rows.filter(r => r.fit.k === 'slight-tight' || r.fit.k === 'slight-loose').length;
  const score = Math.max(0, 100 - alerts.length * 15 - hardTight * 8 - softDiff * 3);
  return { rows, alerts, suggests, score, sizeType };
}

function parseChineseAmount(str){
  const cn = { '零':'0','一':'1','二':'2','两':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9' };
  let s = String(str || '').replace(/[零一二两三四五六七八九]/g, ch => cn[ch] || ch);
  let amount = 0, matched = false;
  const yuanM = s.match(/(\d+(?:\.\d+)?)\s*[块元圆]/);
  if (yuanM) { amount = parseFloat(yuanM[1]); matched = true; }
  if (!matched) { const m = s.match(/(\d+(?:\.\d+)?)/); if (m) { amount = parseFloat(m[1]); matched = true; } }
  return Math.round(amount * 100) / 100;
}
function parseTransactionText(text){
  const t = String(text || '').trim();
  const amount = parseChineseAmount(t);
  let incomeScore = 0, expenseScore = 0;
  INCOME_HINTS.forEach(re => { if (re.test(t)) incomeScore++; });
  EXPENSE_HINTS.forEach(re => { if (re.test(t)) expenseScore++; });
  let type = incomeScore > expenseScore ? 'income' : 'expense';
  let category = type === 'income' ? '其他收入' : '其他';
  const dict = type === 'income' ? INCOME_CATS : EXPENSE_CATS;
  for (const [cat, re] of dict) { if (re.test(t)) { category = cat; break; } }
  return { type, amount, category, note: t };
}

}
function csvEscape(v){ const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function getRangeTransactions(){

function importTransactionsCsv(file){
  const reader = new FileReader();
  reader.onload = function(ev){
    try {
      const raw = ev.target.result.replace(/^\ufeff/, '');
      const lines = raw.split(/\r?\n/).filter(l => l.trim());
      if (lines.length < 2) { toast('CSV 文件为空或格式不正确'); return; }
      const parseCsvLine = (line) => {
        const result = []; let cur = '', inQuote = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (inQuote) {
            if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
            else if (ch === '"') inQuote = false;
            else cur += ch;
          } else {
            if (ch === '"') inQuote = true;
            else if (ch === ',') { result.push(cur); cur = ''; }
            else cur += ch;
          }
        }
        result.push(cur); return result;
      };
      const header = parseCsvLine(lines[0]);
      const idxDate   = header.findIndex(h => h.includes('日期'));
      const idxTime   = header.findIndex(h => h.includes('时间'));
      const idxAmount = header.findIndex(h => h.includes('金额'));
      const idxType   = header.findIndex(h => h.includes('类型'));
      const idxCat    = header.findIndex(h => h.includes('分类'));
      const idxNote   = header.findIndex(h => h.includes('备注'));
      if (idxDate < 0 || idxAmount < 0) { toast('CSV 需至少含"日期"和"金额"列'); return; }
      const existing = new Set(transactions.map(t => `${t.date}|${t.time}|${t.amount}|${t.type}|${t.category}|${t.note}`));
      let added = 0, skipped = 0;
      for (let i = 1; i < lines.length; i++) {
        const cols = parseCsvLine(lines[i]);
        const date = (cols[idxDate] || '').trim();
        const amount = parseFloat((cols[idxAmount] || '').trim());
        if (!date || isNaN(amount)) { skipped++; continue; }
        const time = idxTime >= 0 && (cols[idxTime] || '').trim() ? (cols[idxTime] || '').trim() : fmtTime(new Date());
        const typeStr = idxType >= 0 ? (cols[idxType] || '').trim() : '支出';
        const type = (typeStr === '收入' || typeStr === 'income') ? 'income' : 'expense';
        const category = idxCat >= 0 && (cols[idxCat] || '').trim() ? (cols[idxCat] || '').trim() : (type === 'income' ? '其他收入' : '其他');
        const note = idxNote >= 0 ? (cols[idxNote] || '').trim() : '';
        const sig = `${date}|${time}|${amount}|${type}|${category}|${note}`;
        if (existing.has(sig)) { skipped++; continue; }
        transactions.unshift({ id: Date.now() + Math.floor(Math.random()*1000) + i, date, time, amount, category, note, type });
        existing.add(sig); added++;
      }
      if (added > 0){
        state.transactions = transactions;
        LS.set('app_h_transactions', transactions);
        render();
        toast(`✓ 新增 ${added} 条，跳过重复 ${skipped} 条`);
      } else {
        toast(`没有新增记录（跳过重复 ${skipped} 条）`);
      }
    } catch (err) { console.error(err); toast('导入失败：' + (err.message||'未知')); }
  };
  reader.readAsText(file, 'UTF-8');
}

async function fetchWeather(){
  const el1 = document.getElementById('homeWeather');
  const el2 = document.getElementById('homeTemp');
  if (!el1 || !el2) return;
  try {
    let location = '101010100';
    try {
      const pos = await new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('no geo'));
        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 6000, maximumAge: 30*60*1000 });
      });
      location = `${pos.coords.longitude.toFixed(2)},${pos.coords.latitude.toFixed(2)}`;
    } catch(e){ console.warn('定位失败', e.message); }
    const url = `https://${APP_DEFAULTS.qweather.host}/v7/weather/now?location=${encodeURIComponent(location)}&key=${APP_DEFAULTS.qweather.key}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.code === '200' && data.now) {
      const iconMap = { 100:'☀️',101:'⛅',102:'⛅',103:'⛅',104:'☁️',300:'🌧️',400:'❄️',500:'🌫️' };
      const icon = iconMap[Math.floor(data.now.icon/100)*100] || '☀️';
      el1.textContent = icon + ' ' + data.now.text;
      el2.textContent = data.now.temp + '℃';
      HealthStore.save('lastWeather', { ts: Date.now(), text: data.now.text, temp: data.now.temp, icon: data.now.icon });
      return;
    }
    throw new Error('code '+data.code);
  } catch(e){
    const cached = HealthStore.load('lastWeather', null);
    if (cached){ el1.textContent = '☀️ ' + cached.text; el2.textContent = cached.temp + '℃'; }
    else { el1.textContent = '☀️ 晴'; el2.textContent = '--℃'; }
  }
}

const ttsPlayer = document.getElementById('ttsPlayer');
let _currentBtn = null;
let _ttsRequestId = 0;

function playOnlineTTS(text, lang, btn){
  try {
    if (ttsPlayer){ try { ttsPlayer.pause(); } catch(e){} ttsPlayer.currentTime = 0; }
    const isZh = lang && lang.startsWith('zh');
    const trimmed = String(text).slice(0, 800);
    if (!trimmed.trim()) return;
    const reqId = ++_ttsRequestId;
    const url = isZh
      ? `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(trimmed)}&le=zh`
      : `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(trimmed)}&type=2`;
    ttsPlayer.src = url;
    _currentBtn = btn;
    if (btn) btn.classList.add('playing');
    const cleanup = () => {
      if (reqId !== _ttsRequestId) return;
      if (_currentBtn) _currentBtn.classList.remove('playing');
      _currentBtn = null;
    };
    ttsPlayer.onended = cleanup;
    ttsPlayer.onerror = () => { cleanup(); toast('朗读失败，请检查网络'); };
    const p = ttsPlayer.play();
    if (p && p.catch) p.catch(() => { cleanup(); toast('朗读被拦截，请点两次'); });
  } catch(e){ console.error('TTS 异常', e); toast('朗读异常'); }
}
function stopSpeak(){
  try { if (ttsPlayer){ ttsPlayer.pause(); ttsPlayer.currentTime = 0; } } catch(e){}
  document.querySelectorAll('.playing').forEach(b => b.classList.remove('playing'));
  _currentBtn = null;
  _ttsRequestId++;
}
function toggleSpeak(text, lang, btn){
  if (!text) return;
  const wasPlaying = btn && btn.classList.contains('playing');
  stopSpeak();
  if (wasPlaying) return;
  playOnlineTTS(text, lang, btn);
}
function copyText(text){
  return new Promise(resolve => {
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>resolve(true)).catch(()=>resolve(false)); return; }
    try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); document.body.removeChild(ta); resolve(ok); }catch(e){ resolve(false); }
  });
}
function openExternal(url){
  if (!url){ toast('无链接'); return; }
  const u = String(url).trim();
  if (!/^https?:\/\//i.test(u)){ toast('链接不安全'); return; }
  try { const a = document.createElement('a'); a.href = u; a.target='_blank'; a.rel='noopener noreferrer';
    a.style.display='none'; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),150); }catch(e){ toast('打开失败'); }
}

  }; },
  async call(system, user, maxTokens, temp){
    const cfg = this.endpoints()[this.provider];
    if (!cfg) throw new Error('AI 未配置');
    const r = await fetch(cfg.base, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + this.apiKey },
      body: JSON.stringify({ model: this.model || cfg.model, messages: [{ role:'system', content:system }, { role:'user', content:user }],
        temperature: temp == null ? 0.4 : temp, max_tokens: maxTokens || 1000 }) });

    return (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || null;
  },
  parseJSON(content){
    if (!content) return null;
    let json = content.trim();
    if (json.startsWith('```')) json = json.replace(/^```(?:json)?\s*/, '').replace(/```\s*$/, '');
    const i = json.indexOf('{'), j = json.lastIndexOf('}');
    if (i>=0 && j>i) json = json.slice(i, j+1);
    return JSON.parse(json);

function buildCalendarFromPlans(){
  const data = {};
  const start = new Date(PLAN_START); start.setDate(start.getDate() - 7);
  const end = new Date(PLAN_START); end.setDate(end.getDate() + 200);
  let cur = new Date(start);
  while (cur <= end) {
    const key = localDateStr(cur);
    const plan = getPlanDayInfo(cur);
    const ov = getOverride(cur);
    let item = null;
    if (ov === 'leave' || ov === 'period' || ov === 'rest'){
      const m = { leave:['📝 请假','今日不训练 · 后续计划顺延'], period:['🌸 经期（休息）','今日休息'], rest:['😴 休息','今日完全休息'] }[ov];
      item = { time:'全天', title:m[0], desc:m[1], done:false, type:'rest' };
    } else if (ov === 'swim'){
      item = { time:'19:30', title:'游泳代替今日计划', desc:'原训练顺延 · 40–60 分钟', done:false, type:'swim' };
    } else if (ov === 'reduced'){
      item = { time:'19:30', title:'身体不适（减量训练）', desc:'20–30 分钟', done:false };
    } else if (plan){
      const dayLabels = ['臀腿 + 核心','上肢 + 圆肩','恢复日 + 低强度有氧','全身功能性力量','体态修正 + 臀中肌','游泳','主动恢复'];
      item = { time:'19:30', title:`第${plan.weekIndex}周 · ${dayLabels[plan.dayOfWeek]}`, desc:'按原计划', done:false, type:'sport' };
    }
    if (item) data[key] = [item];
    cur.setDate(cur.getDate() + 1);
  }
  const saved = getManualTodos();
  Object.keys(saved).forEach(k => { data[k] = (data[k] || []).concat((saved[k]||[]).map(x => ({ ...x, manual:true }))); });
  const statusMap = getTodoStatusMap();
  Object.entries(data).forEach(([date, items]) => { items.forEach(it => { if (statusMap[getTodoKey(date, it)]) it.done = true; }); });
  state.calendarData = data;
}
function calMonthPane(){
  buildCalendarFromPlans();
  const y = state.calYear, m = state.calMonth;

  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = todayStr();
  let gridHtml = '';
  for (let i = 0; i < startWeek; i++) gridHtml += '<div class="empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${pad(m+1)}-${pad(d)}`;
    const cls = [];
    if (dateStr === today) cls.push('today');
    if (dateStr === state.selectedDate) cls.push('sel');
    if (state.calendarData[dateStr] && state.calendarData[dateStr].length) cls.push('has');
    const holiday = HOLIDAYS[dateStr];
    if (holiday) cls.push('holiday');
    gridHtml += `<div class="${cls.join(' ')}" data-date="${dateStr}"><span>${d}</span>${holiday ? `<span class="holiday-name">${holiday}</span>` : ''}</div>`;
  }
  const total = startWeek + daysInMonth;
  const rest = (7 - total % 7) % 7;
  for (let i = 0; i < rest; i++) gridHtml += '<div class="empty"></div>';
  const dayList = (state.calendarData[state.selectedDate] || []).slice().sort((a,b) => (a.time||'').localeCompare(b.time||''));
  const dt = new Date(state.selectedDate + 'T00:00:00');
  const holiday = HOLIDAYS[state.selectedDate];
  const dayTl = dayList.length ? dayList.map(it => {
    const payload = encodeURIComponent(JSON.stringify({ date: state.selectedDate, time: it.time, title: it.title }));
    return `<div class="tl-item ${it.done ? 'done' : ''}"><div style="display:flex;gap:10px;align-items:flex-start">

      ${it.manual ? `<button class="del-tx" data-del-todo="${payload}" style="margin-top:2px">✕</button>` : ''}
    </div></div>`;
  }).join('') : '<p class="tip" style="color:#8A90A2">这一天暂无事项记录。</p>';

  <div class="card">
    <div class="cal-head">
      <span class="nav" data-act="prevMonth">‹</span>
      <div class="m">${y} 年 ${m + 1} 月</div>

    <div class="cal-grid">${gridHtml}</div>
  </div>
  <div class="card">
    <div class="row-between" style="margin-bottom:10px;">
      <div style="font-size:14px;font-weight:700;">${dt.getMonth()+1} 月 ${dt.getDate()} 日${holiday ? ' · ' + holiday : ''}</div>
      <button class="mini-add" data-act="newTodo">＋ 新建待办</button>
    </div>
    <div class="tl">${dayTl}</div>
  </div>`;
}

  const weekRows = [];

    const pd = getPlanDayInfo(d);
    const ov = getOverride(d);
    let label = '—', duration = '—', cls = [];
    if (i === dow) cls.push('today');
    if (ov === 'leave' || ov === 'period' || ov === 'rest'){ label = '休息'; cls.push('rest'); }

function renderGradeCard(g){
  if (!g) return '';
  if (g.error) return `<div class="score-card" style="background:#fef3c7;"><div style="font-size:13px;color:#92400e;">⚠️ ${esc(g.error)}</div></div>`;

  const level = g.level || (score>=85?'优秀':score>=70?'良好':score>=55?'合格':'待提升');

async function submitReviewAnswer(){
  const r = state.review; if (!r || r.loading) return;
  const ta = document.getElementById('reviewAnswer'); const answer = (ta && ta.value || '').trim();
  if (!answer){ toast('先写下你的答案'); return; }
  r.answer = answer;
  const item = r.list[r.index];
  const isEn = (r.type === 'english') || item.type === 'english';
  const q = isEn ? (item.w||item.q) : (item.q||item.w);
  const ref = isEn ? item.cn : (item.a + '\n\n要点：' + (item.key||''));
  r.loading = true; renderReviewSheet();
  let result = null;
  if (AI.enabled()){
    try {
      if (isEn){ const jr = await AI.judgeWord(q, answer, ref); if (jr) result = { correct:!!jr.correct, accuracy:jr.score||(jr.correct?90:30), feedback:jr.feedback }; }
      else { const sr = await AI.scoreAnswer(q, answer, ref); if (sr) result = { correct:(sr.accuracy||0)>=60, accuracy:sr.accuracy||0, supplement:sr.supplement||'' }; }
    }catch(e){}
  }
  if (!result){
    const al = answer.toLowerCase(); const rl = ref.toLowerCase();
    const parts = ref.split(/[；;，,、\/\n]+/).map(x => x.trim()).filter(Boolean);
    let correct = false;
    for (const p of parts){ if (p.length>=2 && (al.includes(p.toLowerCase()) || p.toLowerCase().includes(al))){ correct = true; break; } }
    if (!correct && al.length>=2 && rl.includes(al)) correct = true;
    result = { correct, accuracy: correct?85:30, feedback: correct?'意思对了':'和参考答案差距较大' };
  }
  r.loading = false; r.judged = true; r.result = result;
  r.history.push({ q, correct:!!result.correct, feedback: result.feedback||(result.correct?'答对了':'再看一遍参考答案'), userAnswer: answer, reference: ref });
  if (!result.correct) LearnStore.addWrong(isEn?'english':'work', item.w||item.q, q, answer, result.feedback||'');
  renderReviewSheet();
  toast(result.correct?'✓ 答对了':'✗ 已加入错题本');
}

  const r = state.review; if (!r) return;

async function startWeeklyTest(){

}

const restTimers = {};
function startRestTimer(code, sec){
  const key = 'rest-' + code;
  if (restTimers[key]) clearInterval(restTimers[key]);
  let left = sec;
  const el = document.getElementById('rest-' + code);
  if (!el) return;
  el.textContent = left;
  restTimers[key] = setInterval(() => {
    left--;
    if (left <= 0){
      clearInterval(restTimers[key]);
      delete restTimers[key];
      el.textContent = '完成';
      playBeep();
      setTimeout(() => { el.textContent = '--'; }, 2000);
    } else {
      el.textContent = left;
    }
  }, 1000);
}
function playBeep(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
    o.start(); o.stop(ctx.currentTime + 0.8);
  } catch(e){}
}

/* ========== 数据导入导出 ========== */
function doExport(){
  // 读取 localStorage 中以 prefix 开头的所有 key，返回 { 后缀: 值 }
  const readAll = (prefix, sliceLen, def) => {
    const out = {};
    try {
      Object.keys(localStorage).forEach(k => {
        if (k.startsWith(prefix)) out[k.slice(sliceLen)] = LS.get(k, def);
      });
    } catch(e){}
    return out;
  };

  const data = {
    app: 'daily-health',
    version: 2,
    exportedAt: new Date().toISOString(),
    learn: {
      learned: LearnStore.getLearned(),
      wordDeckMap: LS.get('word-deck-map', {}),
      schedule: { english: LearnStore.getSchedule('english'), work: LearnStore.getSchedule('work') },
      wrongBook: LearnStore.getWrongBook(),
      streak: LearnStore.getStreak(),
      aiHistory: LearnStore.getAIHistory(),
      knowDone: LearnStore.getAllKnowDoneEver(),
      thinkDone: readAll('think-done-days:', 16, []),
      thinkAns: readAll('think-ans:', 10, ''),
      notes: readAll('note:', 5, '')
    },
    health: {
      body: { ...body },
      supplementLibrary,
      profile: { ...profile },
      skinState,
      transactions,
      clothes,
      skinProducts,
      planStart: localDateStr(PLAN_START),
      overrides: getOverrides(),
      manualTodos: getManualTodos(),
      todoStatus: getTodoStatusMap(),
      sportSessions: getSportSessions(),
      bodyHistory: getBodyHistory(),
      checks: getChecks(),
      suppDone: readAll('supp-done:', 10, [])
    }
  };

  const json = JSON.stringify(data, null, 2);
  const filename = `日常健康备份_${todayStr()}.json`;
  try {
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      try { URL.revokeObjectURL(url); } catch(e){}
    }, 200);
    toast('已导出：' + filename);
  } catch(err){
    if (window.AndroidBridge && typeof AndroidBridge.saveFile === 'function'){
      try { AndroidBridge.saveFile(json, filename, 'application/json'); return; } catch(e){}
    }
    toast('导出失败：' + err.message);
  }
}
function pickFile(accept, onPick){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = accept || '*/*';
  input.style.position = 'fixed';
  input.style.left = '-9999px';
  input.style.top = '-9999px';
  input.style.width = '1px';
  input.style.height = '1px';
  input.style.opacity = '0';
  input.onchange = e => {
    const f = e.target.files[0];
    if (f) onPick(f);
    setTimeout(() => { try { document.body.removeChild(input); } catch(err){} }, 5000);
  };
  document.body.appendChild(input);
  setTimeout(() => { try { input.click(); } catch(e){ toast('无法打开文件选择器'); } }, 50);
}
function doImport(){
  pickFile('.json,application/json', f => {
    if (!confirm('导入会覆盖当前数据，确定继续？')) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try { doImportConfirm(ev.target.result); }
      catch(err){ toast('文件读取失败：' + err.message); }
    };
    reader.readAsText(f, 'UTF-8');
  });
}
function doImportConfirm(text){
  try {
    const d = JSON.parse(text);
    if (d.learn){
      if (d.learn.learned) LS.set('learned:'+DAY, d.learn.learned);
      if (d.learn.wordDeckMap) LS.set('word-deck-map', d.learn.wordDeckMap);
      if (d.learn.schedule){ if (d.learn.schedule.english) LearnStore.setSchedule('english', d.learn.schedule.english); if (d.learn.schedule.work) LearnStore.setSchedule('work', d.learn.schedule.work); }
      if (d.learn.wrongBook) LS.set('wrong-book', d.learn.wrongBook);
      if (d.learn.streak) LS.set('streak', d.learn.streak);
      if (d.learn.aiHistory) LS.set('ai-history', d.learn.aiHistory);
      // 知识掌握
      if (Array.isArray(d.learn.knowDone) && d.learn.knowDone.length){
        const s = new Set(LearnStore.getAllKnowDoneEver());
        d.learn.knowDone.forEach(q => s.add(q));
        LS.set('know-done:'+DAY, [...s]);
      }
      // 思维模型
      if (d.learn.thinkDone && typeof d.learn.thinkDone === 'object'){
        Object.entries(d.learn.thinkDone).forEach(([name, days]) => { LS.set('think-done-days:'+name, days); });
      }
      if (d.learn.thinkAns && typeof d.learn.thinkAns === 'object'){
        Object.entries(d.learn.thinkAns).forEach(([name, ans]) => { LS.set('think-ans:'+name, ans); });
      }
      if (d.learn.notes && typeof d.learn.notes === 'object'){
        Object.entries(d.learn.notes).forEach(([q, note]) => { LS.set('note:'+q, note); });
      }
    }
    if (d.health){
      if (d.health.body) Object.assign(body, d.health.body);
      if (Array.isArray(d.health.supplementLibrary)){ supplementLibrary = d.health.supplementLibrary; supplements = supplementLibrary; saveSupplementLibrary(); }
      else if (Array.isArray(d.health.supplements)){ supplementLibrary = d.health.supplements; supplements = supplementLibrary; saveSupplementLibrary(); }
      if (d.health.profile){ Object.assign(profile, d.health.profile); HealthStore.save('profile', profile); }
      if (d.health.skinState){ skinState = d.health.skinState; HealthStore.save('skinState', skinState); }
      if (d.health.transactions){ transactions = d.health.transactions; state.transactions = transactions; LS.set('app_h_transactions', transactions); }
      if (d.health.clothes){ clothes = d.health.clothes; LS.set('app_h_clothes', clothes); }
      if (d.health.skinProducts){ skinProducts = d.health.skinProducts; saveSkinProducts(); }
      if (d.health.planStart) setPlanStart(new Date(d.health.planStart + 'T00:00:00'));
      if (d.health.overrides) LS.set('app_h_planOverrides', d.health.overrides);
      if (d.health.manualTodos) saveManualTodos(d.health.manualTodos);
      if (d.health.todoStatus) saveTodoStatusMap(d.health.todoStatus);
      if (d.health.sportSessions) saveSportSessions(d.health.sportSessions);
      if (d.health.bodyHistory) saveBodyHistory(d.health.bodyHistory);
      if (d.health.checks) saveChecks(d.health.checks);
      if (d.health.suppDone && typeof d.health.suppDone === 'object'){
        Object.entries(d.health.suppDone).forEach(([date, ids]) => { LS.set('supp-done:'+date, ids); });
      }
      HealthStore.save('body', body);
    }
    toast('导入成功');
    closeSheet();
    setTimeout(() => location.reload(), 700);
  } catch(err){ toast('格式不对：'+err.message); }
}
function clearAllData(){
  if (!confirm('确定清空？所有学习、健康数据将丢失。')) return;
  const prefixes = ['learned:', 'know-done:', 'passage-done:', 'news-think-', 'news-done:', 'quote-done:', 'story-done:', 'yiyan-done:', 'general-done:', 'expr-done:', 'note:', 'ask-cache:', 'ask-text:', 'think-ans:', 'think-done-days:', 'expr-ans:', 'expr-grade:', 'today-words:', 'schedule:', 'cache:', 'weekly-result:', 'alltest-result', 'ai-', 'streak', 'app_h_', 'supp-done:'];
  try { Object.keys(localStorage).forEach(k => { if (prefixes.some(p => k.startsWith(p))) localStorage.removeItem(k); }); } catch(e){}
  toast('已清空');
  setTimeout(() => location.reload(), 500);
}

/* ================= 讯飞 WebSocket 语音 ================= */
const XUNFEI_CONFIG = {
    APPID: "4c627b59",
    API_SECRET: "YzI1MDJmYWM0NTliNzNkMjl3NGIyM2Uz",
    API_KEY: "2fbffaacd145309be7c024db99e9c7ef",
    HOST: "iat-api.xfyun.cn",
    PATH: "/v2/iat"
};

let xunfeiSocket = null;
let audioContext = null;
let mediaStream = null;
let processor = null;
let isRecording = false;

async function getWebSocketUrl() {
    const date = new Date().toUTCString();
    const signatureOrigin = `host: ${XUNFEI_CONFIG.HOST}\ndate: ${date}\nGET ${XUNFEI_CONFIG.PATH} HTTP/1.1`;
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey(
        'raw', enc.encode(XUNFEI_CONFIG.API_SECRET),
        { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
    );
    const sigBuf = await crypto.subtle.sign('HMAC', key, enc.encode(signatureOrigin));
    const signature = btoa(String.fromCharCode(...new Uint8Array(sigBuf)));
    const authorizationOrigin = `api_key="${XUNFEI_CONFIG.API_KEY}", algorithm="hmac-sha256", headers="host date request-line", signature="${signature}"`;
    const authorization = btoa(authorizationOrigin);
    return `wss://${XUNFEI_CONFIG.HOST}${XUNFEI_CONFIG.PATH}?authorization=${authorization}&date=${encodeURIComponent(date)}&host=${XUNFEI_CONFIG.HOST}`;
}

async function startXunfeiRecognition() {
    if (isRecording) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        toast('浏览器不支持麦克风'); return;
    }
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true } });
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const source = audioContext.createMediaStreamSource(mediaStream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);

        let wsUrl;
        try { wsUrl = await getWebSocketUrl(); }
        catch (e) { toast('签名失败：' + (e.message || '')); throw e; }

        xunfeiSocket = new WebSocket(wsUrl);

        xunfeiSocket.onopen = () => {
            isRecording = true;
            const mic = document.getElementById('micBtn'); if (mic) mic.classList.add('listening');
            const hint = document.getElementById('micHint'); if (hint) hint.textContent = '正在聆听...（再次点击麦克风结束）';

            xunfeiSocket.send(JSON.stringify({
                common: { app_id: XUNFEI_CONFIG.APPID },
                business: { language: 'zh_cn', domain: 'iat', accent: 'mandarin', vad_eos: 3000, dwa: 'wpgs' },
                data: { status: 0, format: 'audio/L16;rate=16000', encoding: 'raw' }
            }));

            processor.onaudioprocess = (e) => {
                if (!isRecording) return;
                const inputData = e.inputBuffer.getChannelData(0);
                const pcmData = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    pcmData[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                }
                const uint8Array = new Uint8Array(pcmData.buffer);
                let binary = '';
                for (let i = 0; i < uint8Array.length; i++) binary += String.fromCharCode(uint8Array[i]);
                const base64Data = btoa(binary);

                if (xunfeiSocket.readyState === WebSocket.OPEN) {
                    xunfeiSocket.send(JSON.stringify({ data: { status: 1, format: 'audio/L16;rate=16000', encoding: 'raw', audio: base64Data } }));
                }
            };
            source.connect(processor);
            processor.connect(audioContext.destination);
        };

        let resultText = '';
        xunfeiSocket.onmessage = (e) => {
            const res = JSON.parse(e.data);
            if (res.code !== 0) { console.error('讯飞错误:', res); toast('识别错误 code=' + res.code); return; }
            if (res.data && res.data.result) {
                let text = res.data.result.ws.map(w => w.cw.map(c => c.w).join('')).join('');
                if (res.data.result.pgs === 'rpl') {
                    resultText = resultText.slice(0, -res.data.result.rg[0]) + text;
                } else {
                    resultText += text;
                }
            }
            if (res.data && res.data.status === 2) {
                stopXunfeiRecognition();
                if (resultText.trim()) {
                    state.pendingTx = parseTransactionText(resultText.trim());
                    renderTxEditor();
                    toast('已识别：' + resultText.slice(0, 20));
                }
            }
        };

        xunfeiSocket.onerror = (err) => { console.error('WS 错误', err); stopXunfeiRecognition(); toast('语音识别网络错误'); };
        xunfeiSocket.onclose = () => { if (isRecording) { stopXunfeiRecognition(); } };
    } catch (err) {
        console.error(err);
        toast('无法访问麦克风: ' + (err.message || err));
        const mic = document.getElementById('micBtn'); if (mic) mic.classList.remove('listening');
    }
}

function stopXunfeiRecognition() {
    isRecording = false;
    if (processor) { try { processor.disconnect(); } catch(e){} processor = null; }
    if (audioContext) { try { audioContext.close(); } catch(e){} audioContext = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (xunfeiSocket && xunfeiSocket.readyState === WebSocket.OPEN) {
        try { xunfeiSocket.send(JSON.stringify({ data: { status: 2, format: 'audio/L16;rate=16000', encoding: 'raw', audio: '' } })); } catch(e){}
        setTimeout(() => { try { if (xunfeiSocket) xunfeiSocket.close(); } catch(e){} xunfeiSocket = null; }, 500);
    } else { xunfeiSocket = null; }
    const mic = document.getElementById('micBtn'); if (mic) mic.classList.remove('listening');
    const hint = document.getElementById('micHint'); if (hint) hint.textContent = '点击麦克风开始语音输入';
}

        el.innerHTML = results.slice(0,50).map(r => `<div style="padding:12px 4px;border-bottom:1px solid #f0f1f6;">
          <span style="display:inline-block;font-size:10.5px;font-weight:750;padding:2px 7px;border-radius:5px;margin-bottom:6px;background:${r.type==='valve'?'#eef0ff':'#ecfdf5'};color:${r.type==='valve'?'#4f46e5':'#047857'};">${r.label}</span>
          <div style="font-size:14px;font-weight:650;line-height:1.5;margin-bottom:4px;">${esc(r.q)}</div>
          <div style="font-size:12.5px;color:var(--sub);line-height:1.6;">${esc(r.snip)}</div>
        </div>`).join('') || `<div style="text-align:center;padding:20px;font-size:12.5px;color:var(--sub);">没有找到</div>`;
      });
    }
  }, 100);
});
window.addEventListener('beforeunload', () => {
  HealthStore.save('body', body);
  HealthStore.save('selectedDate', state.selectedDate);
  HealthStore.save('calYear', state.calYear);
  HealthStore.save('calMonth', state.calMonth);
  HealthStore.save('setsDone', state.setsDone);
});

/* ================= 走一走提醒 ================= */
const WALK_LAST_KEY = 'app_h_lastWalkReminder';
let _walkTimerHandle = null;
let _walkCountdownHandle = null;
let _walkEndTs = 0;

function isInWalkWindow(){
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  return (mins >= 8*60 + 30 && mins <= 11*60 + 30) ||
         (mins >= 13*60 + 30 && mins <= 17*60);
}
function vibratePattern(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }
function speakText(text){
  const t = String(text || '');
  if (!t) return;
  try {
    if ('speechSynthesis' in window){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'zh-CN'; u.rate = 1.0;
      speechSynthesis.speak(u);
    }
  } catch(e){}
}
function requestNotifPermission(){
  try {
    if (typeof Notification === 'undefined') return;
    if (Notification.permission === 'default') Notification.requestPermission();
  } catch(e){}
}
function showWalkNotification(){
  try {
    if (typeof Notification === 'undefined') return;
    if (Notification.permission !== 'granted') return;
    const n = new Notification('该站起来走动了', {
      body: '起身 → 走动 2–3 分钟 → 下巴轻收 5 次 → 肩胛向后下轻收 5–8 次',
      tag: 'walk-reminder-' + Math.floor(Date.now() / 30000),
      requireInteraction: true,
      silent: false
    });
    n.onclick = () => { try { window.focus(); n.close(); } catch(e){} };
    setTimeout(() => { try { n.close(); } catch(e){} }, 30000);
  } catch(e){}
}
function finishWalkTimer(){
  const el = document.getElementById('centerTimer');
  if (el) el.classList.remove('show');
  if (_walkCountdownHandle){ clearInterval(_walkCountdownHandle); _walkCountdownHandle = null; }
  _walkEndTs = 0;
  try { playBeep(); } catch(e){}
  setTimeout(() => { try { playBeep(); } catch(e){} }, 420);
  vibratePattern([300, 150, 300]);
  setTimeout(() => speakText('时间到，回到座位继续吧'), 500);
}
function startWalkTimer(sec){
  const el = document.getElementById('centerTimer');
  const num = document.getElementById('centerTimerNum');
  if (!el || !num) return;
  const duration = Math.max(1, parseInt(sec, 10) || 200);
  _walkEndTs = Date.now() + duration * 1000;
  num.textContent = duration;
  el.classList.add('show');
  if (_walkCountdownHandle) clearInterval(_walkCountdownHandle);
  _walkCountdownHandle = setInterval(() => {
    const left = Math.max(0, Math.ceil((_walkEndTs - Date.now()) / 1000));
    num.textContent = left;
    if (left <= 0) finishWalkTimer();
  }, 250);
  speakText('开始动一动');
  vibratePattern([150]);
}
function checkWalkReminder(force){
  if (!force && !isInWalkWindow()) return;
  const last = parseInt(LS.get(WALK_LAST_KEY, '0') || '0', 10);
  const now = Date.now();
  if (!force && now - last < 30 * 60 * 1000) return;
  LS.set(WALK_LAST_KEY, now);
  if (!_walkEndTs || _walkEndTs < now) startWalkTimer(200);
  showWalkNotification();
}
function initWalkReminder(){
  requestNotifPermission();
  setTimeout(() => checkWalkReminder(false), 3000);
  if (_walkTimerHandle) clearInterval(_walkTimerHandle);
  _walkTimerHandle = setInterval(() => checkWalkReminder(false), 60 * 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkWalkReminder(false);
  });
  window.addEventListener('focus', () => checkWalkReminder(false));
}

/* ================= 初始化 ================= */
(function init(){
  loadDataFromGlobals();
  buildCalendarFromPlans();
  LearnStore.checkIn();
  render();
  initWalkReminder();
  setInterval(() => {
    const el = document.getElementById('sportTimer');
    if (el){
      const sess = getSportSession();
      if (sess && !sess.endTs){
        const total = Math.floor((Date.now() - sess.startTs) / 1000);
        const h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
        el.textContent = h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
        const sc = document.getElementById('sportSetCount');
        if (sc) sc.textContent = Object.values(sess.sets || {}).reduce((a,b) => a + b.length, 0);
      }
    }
  }, 1000);
})();
</script>
