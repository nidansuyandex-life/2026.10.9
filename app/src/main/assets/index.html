<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>日常 · 健康生活</title>
<script src="./data/decks.js"></script>
<script src="./data/valve.js"></script>
<script src="./data/thinking.js"></script>
<script src="./data/scenes.js"></script>
<style>
:root{--brand:#4f46e5;--brand2:#7c3aed;--sub:#6b7280;--ok:#059669;--warn:#b45309;--err:#dc2626;--accent:#1FBFA9;--accent2:#5FD9C4;--accent-soft:#E7F9F5;--hot:#FF6B5B;--hot2:#FFA36B;--hot-soft:#FFF0EC;--purple:#8B7CF6;--purple2:#B39BFF;--purple-soft:#F1EEFF;--blue:#4A9EFF;--blue2:#7FC4FF;--blue-soft:#EAF3FF;--pink:#FF6FA5;--pink2:#FFA1C4;--pink-soft:#FFEEF5;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#e9ebf3;color:#111827;display:flex;justify-content:center;min-height:100dvh;overflow:hidden;}
.phone{position:relative;width:100%;max-width:460px;height:100dvh;background:linear-gradient(180deg,#fbfbfe,#f3f4fa);display:flex;flex-direction:column;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 0 0 4px rgba(79,70,229,.12);}
.today{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;}
.top-icon-btn{border:0;background:#fff;width:34px;height:34px;border-radius:11px;font-size:15px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.06);}
#view{flex:1;overflow-y:auto;padding:2px 16px 90px;}
#view::-webkit-scrollbar{width:0;}
.tabbar{flex-shrink:0;display:flex;background:rgba(255,255,255,.95);border-top:1px solid rgba(0,0,0,.06);padding:8px 2px calc(8px + env(safe-area-inset-bottom));}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;border-radius:12px;cursor:pointer;color:#9aa0b0;font-size:9.5px;font-weight:600;font-family:inherit;}
.tab.on{color:var(--brand);}
.tab-icon{font-size:16px;line-height:1;}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid rgba(16,24,40,.045);box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 22px -14px rgba(16,24,40,.28);}
.card.done{background:#f8f9fd;border-style:dashed;opacity:.72;}
.hero{padding:4px 4px 14px;}
.hero-k{font-size:12px;color:var(--brand);font-weight:700;letter-spacing:.5px;margin-bottom:7px;}
.hero h1{font-size:22px;margin:0;letter-spacing:-.5px;}
.sec-title{font-size:13px;font-weight:700;color:#3b4256;margin:18px 4px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.sec-title .muted{font-weight:500;font-size:11.5px;display:flex;align-items:center;gap:6px;}
.muted{color:var(--sub);}
.foot-note{text-align:center;font-size:11.5px;color:#aab0c0;padding:18px 0 4px;}
.btn{border:0;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:650;cursor:pointer;font-family:inherit;}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px -10px rgba(79,70,229,.9);}
.btn.wide{width:100%;margin-top:6px;}
.btn.ghost{background:#f1f2f9;color:#4b5265;padding:8px 14px;font-size:13px;}
.btn.danger{background:#fef2f2;color:#dc2626;padding:8px 14px;font-size:13px;}
.btn-primary{width:100%;border:none;font-family:inherit;font-size:15px;font-weight:600;color:#fff;padding:15px;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-top:4px;}
.btn-ghost-h{width:100%;border:none;font-family:inherit;font-size:14px;font-weight:600;padding:13px;border-radius:14px;cursor:pointer;background:var(--accent-soft);color:var(--accent);}
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px -16px;padding:6px 16px 12px;flex-wrap:nowrap;}
.chips::-webkit-scrollbar{display:none;}
.chip{border:1px solid #e6e8f0;background:#fff;color:#5b6276;padding:8px 15px;border-radius:99px;font-size:13.5px;font-weight:650;white-space:nowrap;cursor:pointer;flex-shrink:0;font-family:inherit;}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.subtabs{display:flex;gap:5px;background:#fff;border-radius:14px;padding:5px;margin-bottom:12px;border:1px solid rgba(16,24,40,.05);overflow-x:auto;}
.subtabs::-webkit-scrollbar{display:none;}
.subtab{border:0;background:none;padding:9px 12px;border-radius:10px;font-size:12.5px;font-weight:650;color:#7a8194;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;}
.subtab.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;}
.tip-card{background:#fff;border:1px dashed #dfe2ee;border-radius:16px;padding:14px;font-size:12.5px;line-height:1.7;color:#5b6276;margin-top:4px;}
.loading-card{background:#fff;border-radius:18px;padding:32px 20px;text-align:center;margin-bottom:12px;}
.err-inline{background:#fef3c7;border:1px solid #fde68a;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.7;color:#92400e;margin-top:8px;}
.src-tag{display:inline-block;font-size:10.5px;font-weight:750;padding:2px 8px;border-radius:5px;margin-bottom:8px;background:#eef0ff;color:var(--brand);}
.sk{background:linear-gradient(90deg,#eef0f7 25%,#f7f8fc 37%,#eef0f7 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:18px;margin-bottom:12px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.home-head{background:#fff;border-radius:20px;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;}
.home-head .left .title{font-size:24px;font-weight:800;letter-spacing:.5px;color:#1B1F2A;}
.home-head .left .suggest{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.65;max-width:230px;}
.home-head .right{text-align:right;flex:none;}
.home-head .right .date{font-size:14px;font-weight:700;}
.home-head .right .weather{font-size:13px;color:#5A6175;margin-top:8px;}
.home-head .right .temp{font-size:12.5px;color:var(--sub);margin-top:3px;}
.home-tl-wrap{background:#fff;border-radius:18px;margin-bottom:12px;overflow:hidden;}
.home-tl-item{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;transition:background .15s;cursor:pointer;}
.home-tl-item:active{background:#f5fbfa;}
.home-tl-item:not(:last-child)::after{content:'';position:absolute;left:29px;bottom:-6px;width:1.5px;height:14px;background:#E6E9F1;}
.home-tl-text{flex:1;font-size:13.5px;color:#1B1F2A;line-height:1.5;min-width:0;}
.home-tl-text .tm{color:var(--sub);font-size:11.5px;font-weight:600;margin-right:8px;}
.home-tl-text .sub{color:var(--sub);font-size:11.5px;display:block;margin-top:2px;line-height:1.45;}
.home-tl-arrow{color:var(--accent);font-size:16px;flex:none;opacity:.55;}
.home-tl-badge{font-size:10px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;font-weight:700;flex:none;}
.home-tl-item.is-done .home-tl-text{color:var(--sub);}
.check{width:22px;height:22px;border-radius:50%;border:2px solid #E3E6EF;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer;transition:.2s;background:#fff;}
.check.done{background:var(--accent);border-color:var(--accent);}
.check.done::after{content:'✓';}
.body-state-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.body-state-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;border-radius:12px;background:#F7F8FC;border:1.5px solid transparent;cursor:pointer;font-size:11.5px;font-weight:600;color:#3A4152;text-align:center;line-height:1.25;transition:.15s;}
.body-state-item .bsi-icon{font-size:20px;line-height:1;}
.body-state-item .bsi-label{font-size:11px;font-weight:600;white-space:nowrap;}
.body-state-item.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.body-state-item.active .bsi-label{color:var(--accent);font-weight:700;}
.task-card{background:linear-gradient(135deg,#fff,#f8f9fd);border:1px solid rgba(79,70,229,.12);border-radius:18px;padding:16px;margin-bottom:14px;}
.task-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.task-title{font-size:14px;font-weight:750;}
.task-progress{font-size:12px;color:var(--sub);font-weight:600;}
.task-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #eceef4;cursor:pointer;}
.task-row:last-child{border:0;}
.task-check{width:22px;height:22px;border-radius:8px;border:2px solid #dfe2ee;background:#fff;display:grid;place-items:center;font-size:12px;flex-shrink:0;color:#fff;font-weight:700;}
.task-check.on{background:var(--brand);border-color:var(--brand);}
.task-label{flex:1;font-size:13px;font-weight:600;color:#3f4658;}
.task-label.on{color:#aab0c0;text-decoration:line-through;}
.task-count{font-size:11.5px;color:var(--sub);font-weight:600;}
.review-entry{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;border-radius:18px;padding:14px;margin-bottom:14px;}
.review-entry .r-title{font-size:13.5px;font-weight:750;color:#92400e;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;}
.review-entry .r-meta{font-size:12px;color:#a16207;line-height:1.7;margin-bottom:10px;}
.streak-badge{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;font-size:10.5px;font-weight:750;padding:2px 7px;border-radius:99px;}
.know-q{font-size:15.5px;font-weight:750;line-height:1.5;}
.know-a{font-size:13.5px;line-height:1.78;color:#3f4658;margin-top:12px;padding-top:12px;border-top:1px dashed #eceef4;}
.know-key{margin-top:12px;background:#f8f9fd;border-left:3px solid var(--brand);padding:11px 13px;border-radius:0 10px 10px 0;font-size:12.5px;line-height:1.75;color:#4b5265;}
.know-body{display:none;margin-top:12px;}
.know.open .know-body{display:block;}
.know-cat{display:inline-block;font-size:11px;font-weight:700;color:var(--brand);background:#eef0ff;padding:3px 9px;border-radius:6px;margin-bottom:10px;}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e6e8f0;border-radius:14px;padding:10px 14px;margin:8px 0 4px;}
.search-input{flex:1;border:0;outline:0;background:transparent;font-size:14px;padding:2px 0;font-family:inherit;}
.word-mini{background:#fff;border:1px solid rgba(16,24,40,.06);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:8px;}
.word-mini.done{background:#f8f9fd;opacity:.65;border-style:dashed;}
.word-mini .wm-word{font-size:15px;font-weight:750;color:#2b3244;flex-shrink:0;}
.word-mini.done .wm-word{text-decoration:line-through;color:#aab0c0;}
.word-mini .wm-cn{font-size:12px;color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.word-mini .wm-check{width:22px;height:22px;border-radius:50%;border:2px solid #dfe2ee;background:#fff;display:grid;place-items:center;font-size:11px;flex-shrink:0;color:#fff;font-weight:700;}
.word-mini .wm-check.on{background:var(--brand);border-color:var(--brand);}
.word-big{font-size:32px;font-weight:850;letter-spacing:-.8px;color:#2b3244;}
.word-ph{font-size:13px;color:var(--sub);margin-top:6px;}
.deck-chip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:#fff;border:1px solid #e6e8f0;border-radius:14px;padding:11px 14px;cursor:pointer;flex-shrink:0;min-width:130px;text-align:left;font-family:inherit;}
.deck-chip.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;}
.deck-chip .dc-name{font-size:13.5px;font-weight:750;}
.deck-chip .dc-meta{font-size:11px;opacity:.7;}
.progress-bar{height:8px;background:#e5e7f5;border-radius:99px;overflow:hidden;margin-top:10px;}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .4s;}
.load-more{border:0;background:#f1f2f9;color:#4b5265;width:100%;padding:13px;border-radius:12px;font-size:13px;font-weight:650;cursor:pointer;margin-top:6px;font-family:inherit;}
.answer-input{width:100%;min-height:80px;border:1px solid #e6e8f0;border-radius:12px;padding:12px;font-size:14px;line-height:1.7;resize:vertical;background:#fafbfe;margin-top:6px;font-family:inherit;}
.score-card{background:#fff;border:1px solid #e2e5ff;border-radius:16px;padding:16px;margin-top:14px;}
.score-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.score-num{font-size:34px;font-weight:850;color:var(--brand);letter-spacing:-1.5px;line-height:1;}
.score-label{font-size:12px;font-weight:700;color:var(--brand);}
.score-row{margin-top:12px;padding-top:12px;border-top:1px dashed #eceef4;}
.score-row-title{font-size:12px;font-weight:750;margin-bottom:8px;}
.score-extra{background:#f8f9fd;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.78;color:#4b5265;}
.score-list{margin:0;padding-left:18px;}
.score-list li{font-size:13px;line-height:1.75;color:#3f4658;}
.rate-row{display:flex;gap:8px;margin-top:14px;}
.rate-btn{flex:1;border:0;padding:12px 4px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.rate-btn.again{background:#fef2f2;color:#dc2626;}
.rate-btn.hard{background:#fef3c7;color:#b45309;}
.rate-btn.good{background:#ecfdf5;color:#047857;}
.h-task{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid #F3F5F9;}
.h-task:last-child{border-bottom:none;padding-bottom:0;}
.h-task .body{flex:1;min-width:0;}
.h-t-name{font-size:14px;font-weight:500;}
.tag{font-size:11px;padding:3px 9px;border-radius:9px;background:#F3F5F9;color:#7A8196;font-weight:500;}
.tag.on{background:var(--accent-soft);color:var(--accent);}
.progress{height:8px;border-radius:8px;background:#F0F2F7;overflow:hidden;margin:2px 0 9px;}
.progress .bar{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.row-between{display:flex;justify-content:space-between;align-items:center;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.stat{background:#fff;border-radius:16px;padding:14px 8px;text-align:center;}
.stat .v{font-size:18px;font-weight:700;}
.stat .k{font-size:11px;color:var(--sub);margin-top:5px;}
.stat .d{font-size:10px;color:var(--sub);margin-top:3px;font-weight:600;}
.tl{position:relative;padding-left:24px;}
.tl::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:#EDF0F6;}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:'';position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #DDE2EC;box-sizing:border-box;}
.tl-item.done::before{background:var(--accent);border-color:var(--accent);}
.tl-time{font-size:11px;color:var(--sub);margin-bottom:3px;font-weight:500;}
.tl-title{font-size:14px;font-weight:500;}
.tl-item.done .tl-title{text-decoration:line-through;color:var(--sub);}
.tl-desc{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.55;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-head .m{font-size:15px;font-weight:700;}
.cal-head span.nav{color:#B9C0D0;font-size:17px;cursor:pointer;padding:0 6px;}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-week div{text-align:center;font-size:11px;color:#A3A9B8;padding:4px 0;font-weight:500;}
.cal-grid div{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;border-radius:10px;position:relative;color:#3A4152;cursor:pointer;user-select:none;padding:2px 0;}
.cal-grid div.empty{visibility:hidden;cursor:default;}
.cal-grid div.sel{background:var(--blue-soft);color:var(--blue);font-weight:600;}
.cal-grid div.today{background:var(--blue);color:#fff;font-weight:700;}
.cal-grid div.has::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--blue);opacity:.75;}
.cal-grid div.today.has::after{background:#fff;opacity:1;}
.cal-grid div.holiday{color:var(--hot);font-weight:700;}
.cal-grid div.holiday .holiday-name{font-size:8px;line-height:1;margin-top:1px;font-weight:500;color:var(--hot);}
.cal-grid div.today.holiday .holiday-name{color:#fff;}
.balance{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:20px;padding:20px;margin-bottom:12px;}
.balance .lab{font-size:12px;opacity:.85;}
.balance .big{font-size:30px;font-weight:700;margin-top:8px;}
.balance .foot{display:flex;gap:26px;margin-top:16px;font-size:11.5px;opacity:.92;}
.mic-wrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 20px;}
.mic{width:104px;height:104px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(145deg,var(--accent2),var(--accent));font-size:40px;color:#fff;transition:.2s;}
.mic.listening{animation:pulseMic 1.4s infinite;box-shadow:0 0 0 6px rgba(31,191,169,.15);}
@keyframes pulseMic{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.mic-hint{margin-top:16px;font-size:12.5px;color:var(--sub);text-align:center;padding:0 20px;line-height:1.6;}
.text-input-area{display:none;margin-top:10px;width:100%;}
.text-input-area.show{display:block;}
.text-input-area input{width:100%;border:1.5px solid #E3E6EF;border-radius:12px;padding:12px 14px;font-family:inherit;font-size:13.5px;outline:none;margin-bottom:8px;}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F3F5F9;cursor:pointer;border-radius:8px;}
.tx:last-child{border-bottom:none;padding-bottom:0;}
.tx .ic{width:38px;height:38px;border-radius:12px;background:#F5F7FB;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;}
.tx .body{flex:1;min-width:0;}
.tx .amt{font-weight:600;font-size:14px;margin-left:8px;}
.tx .amt.inc{color:var(--accent);}
.tx .del-tx{width:24px;height:24px;border-radius:50%;border:none;background:#FFEDEA;color:var(--hot);font-size:12px;cursor:pointer;flex:none;line-height:1;}
.cat-chip{font-size:11.5px;padding:6px 12px;border-radius:10px;background:#F3F5F9;color:#5A6175;font-weight:500;cursor:pointer;border:none;font-family:inherit;margin:2px;display:inline-block;}
.cat-chip.active{background:var(--accent);color:#fff;}
.cat-chip.newcat{background:var(--blue-soft);color:var(--blue);}
.sport-timer{font-size:40px;font-weight:700;color:var(--accent);text-align:center;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;margin:4px 0 2px;line-height:1.1;}
.sport-timer-sub{text-align:center;font-size:12px;color:var(--sub);margin-bottom:4px;}
.sport-meta{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:12px;color:#5A6175;flex-wrap:wrap;}
.sport-meta b{color:#1B1F2A;font-weight:700;}
.sport-done-badge{display:inline-block;margin-top:10px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;}
.week-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #F3F5F9;font-size:13px;}
.week-row:last-child{border-bottom:none;padding-bottom:0;}
.week-row .d{width:42px;flex:none;font-weight:600;color:#5A6175;font-size:12px;}
.week-row .dt{width:44px;flex:none;color:#B9C0D0;font-size:10.5px;}

const DAY = Math.floor((Date.now() + 8*3600*1000) / 86400000);

const WEEK_CN = '日一二三四五六';

function bjDate(){ return new Date(Date.now() + 8*3600*1000); }
function fmtDate(){ const d = bjDate(); return (d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日 星期'+WEEK_CN[d.getUTCDay()]; }
function todayStr(){ const d = bjDate(); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function prevDayStr(){ const d = new Date(Date.now()-86400000+8*3600*1000); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function localDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtShort(d){ return (d.getMonth()+1)+'/'+d.getDate(); }

const LS = {
  get(k,d){ try { const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); } catch(e){ return d; } },
  set(k,v){ try { localStorage.setItem(k,JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dailyPick(arr,n,salt=0){
  if(!arr||!arr.length) return [];
  let seed=(DAY*1000+salt*7919)%2147483647;
  if(seed<=0) seed+=2147483646;
  const rnd=()=>{seed=(seed*16807)%2147483647; return (seed-1)/2147483646;};
  const idx=arr.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx.slice(0,n).map(i=>arr[i]);
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function raceTimeout(promise, ms, errMsg='请求超时'){ return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error(errMsg)), ms))]); }
function friendlyErr(e){
  const msg = (e && e.message) ? e.message : String(e || '');
  if (/Failed to fetch/i.test(msg)) return '网络不通';
  if (/aborted|timeout|请求超时/i.test(msg)) return '请求超时';
  if (/HTTP 404/.test(msg)) return 'HTTP 404';
  if (/HTTP 429/.test(msg)) return '请求过于频繁';
  if (/HTTP 403/.test(msg)) return '无权限';
  if (/code=130/.test(msg)) return 'QPS 超限（稍后重试）';
  if (/code=140/.test(msg)) return '接口未申请';
  if (/无内容/.test(msg)) return '接口返回空';
  return msg || '失败';
}
async function fetchJson(url, timeout=8000){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try { const r = await fetch(url, { signal: controller.signal }); if (!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally { clearTimeout(timer); }
}
async function fetchText(url, timeout=8000){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try { const r = await fetch(url, { signal: controller.signal }); if (!r.ok) throw new Error('HTTP '+r.status); return await r.text(); }
  finally { clearTimeout(timer); }
}
function extractList(result){
  if (!result) return [];
  if (Array.isArray(result)) return result;
  if (Array.isArray(result.newslist)) return result.newslist;
  if (Array.isArray(result.list)) return result.list;
  if (result.title || result.content || result.description || result.en) return [result];
  return [];
}

  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;

  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 1900);
}

const TianapiQueue = {
  _lastTs: 0, _tail: Promise.resolve(), _pending: 0,
  async run(fn){
    this._pending++;
    const prev = this._tail;
    let release;
    this._tail = new Promise(r => { release = r; });
    try {
      await prev.catch(() => {});
      const now = Date.now();
      const wait = Math.max(0, 1200 - (now - this._lastTs));
      if (wait > 0) await new Promise(r => setTimeout(r, wait));
      try { return await fn(); }
      finally { this._lastTs = Date.now(); }
    } finally { this._pending--; release(); }
  }
};
async function tianapiFetch(url, timeout=8000){ return await TianapiQueue.run(async () => await raceTimeout(fetchJson(url, timeout), timeout + 1000)); }

const DeckLoader = {
  loaded:{}, loading:{},
  load(deckId){
    if (this.loaded[deckId]) return Promise.resolve(this.loaded[deckId]);
    if (this.loading[deckId]) return this.loading[deckId];
    if (window.__WORD_DECK_DATA && window.__WORD_DECK_DATA[deckId]){
      const words = window.__WORD_DECK_DATA[deckId].map(w => ({ ...w, deck: deckId }));
      this.loaded[deckId] = words; return Promise.resolve(words);
    }
    const meta = SEED.DECKS.find(d => d.id === deckId);
    if (!meta || !meta.file){ this.loaded[deckId] = []; return Promise.resolve([]); }
    this.loading[deckId] = new Promise(resolve => {
      const s = document.createElement('script'); s.src = meta.file;
      s.onload = () => { const raw = (window.__WORD_DECK_DATA && window.__WORD_DECK_DATA[deckId]) || []; const words = raw.map(w => ({ ...w, deck: deckId })); this.loaded[deckId] = words; resolve(words); };
      s.onerror = () => { this.loaded[deckId] = []; resolve([]); };
      document.head.appendChild(s);
    });
    return this.loading[deckId];
  },
  get(deckId){
    if (deckId === 'all'){ const all = []; SEED.DECKS.forEach(d => { const w = this.loaded[d.id]; if (Array.isArray(w)) all.push(...w); }); return all; }
    return this.loaded[deckId] || [];
  },
  findWord(wordStr){
    const map = LS.get('word-deck-map', {}); const deckId = map[wordStr];
    if (deckId && this.loaded[deckId]){ const found = this.loaded[deckId].find(w => w.w === wordStr); if (found) return found; }
    for (const id in this.loaded){ const found = (this.loaded[id] || []).find(w => w.w === wordStr); if (found) return found; }
    return null;
  },
  async ensureForReview(){
    const map = LS.get('word-deck-map', {}); const ids = new Set(Object.values(map));
    if (!ids.size){ for (const d of SEED.DECKS) await this.load(d.id).catch(()=>[]); return; }
    await Promise.all([...ids].map(id => this.load(id).catch(() => [])));
  }
};

function analyzeIngredients(name, ingrText){
  const reasons = []; let level = 'ok';
  const setLevel = (lv, reason) => { if (lv === 'avoid') level = 'avoid'; else if (lv === 'caution' && level !== 'avoid') level = 'caution'; if (reason) reasons.push(reason); };
  const t = ingrText || '';
  if (/过氧化苯甲酰|benzoyl/i.test(t)){ if (profile.sensitivity === '高') setLevel('avoid','含过氧化苯甲酰，敏感肌建议避免'); else if (profile.sensitivity === '中') setLevel('caution','含过氧化苯甲酰，建议仅局部点涂'); else reasons.push('含过氧化苯甲酰，适合痘痘期局部使用'); }
  if (/壬二酸|azelaic/i.test(t)){ if (profile.sensitivity === '高') setLevel('caution','含壬二酸，敏感肌需先建立耐受'); else setLevel('caution','含壬二酸，初期可能刺痒'); }
  if (/烟酰胺|niacinamide/i.test(t)){ if (profile.sensitivity === '高') setLevel('caution','含烟酰胺，敏感肌可能刺痛'); else reasons.push('含烟酰胺，控油提亮'); }
  if (/抗坏血酸|ascorbic|维c|乙基/i.test(t)){ if (profile.sensitivity === '高') setLevel('caution','含维C，敏感肌需耐受'); else reasons.push('含维C，抗氧化'); }
  if (/神经酰胺|泛醇|积雪草|透明质酸|角鲨烷/i.test(t)) reasons.push('含修复屏障成分');
  if (level === 'ok' && !reasons.length) reasons.push('未检测到明显风险成分');
  return { level, reasons };
}

function calcShape(){
  const s = body.shoulder, w = body.waist, h = body.hip;
  const whr = w / h, shr = s / h;
  if (whr <= 0.76) {
    if (Math.abs(shr - 1) < 0.06) return { name:'沙漏型', desc:'肩臀接近，腰线明显' };
    if (shr > 1.06) return { name:'倒三角型', desc:'肩部较宽' };
    return { name:'梨形', desc:'臀胯较宽' };
  }
  if (shr >= 1.06) return { name:'倒三角型', desc:'肩部偏宽' };
  if (h - s >= 6) return { name:'梨形', desc:'臀胯偏宽' };
  return { name:'矩形', desc:'肩腰臀比例接近' };
}
function fitEase(ease, soft, hard){
  if (ease < -hard) return { k:'tight', t:'偏紧', color:'#FF6B5B', bg:'#FFEDEA' };
  if (ease < -soft) return { k:'slight-tight', t:'略紧', color:'#D98A0B', bg:'#FFF4E0' };
  if (ease <= soft) return { k:'ok', t:'合身', color:'#1FBFA9', bg:'#E7F9F5' };
  if (ease <= hard) return { k:'slight-loose', t:'略松', color:'#4A9EFF', bg:'#EAF3FF' };
  return { k:'loose', t:'偏松', color:'#8B7CF6', bg:'#F1EEFF' };
}
function analyzeGarment(){
  const cat = state.closetCat || 'top';
  const sizeType = getSizeType(cat);
  if (sizeType === 'free') return null;
  const g = state.garmentDraft || {};
  const rows = [], alerts = [], suggests = [];
  const shape = calcShape();
  if (sizeType === 'cloth'){
    if (g.bust){ const e = g.bust - body.bust; rows.push({ label:'胸围松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,2,6) }); }
    if (g.shoulder){ const d = body.shoulder - g.shoulder; rows.push({ label:'肩宽差', value:d>0?`身体宽 ${d.toFixed(1)} cm`:`衣服宽 ${(-d).toFixed(1)} cm`, fit:fitEase(d,1.5,3.5) }); }
    if (shape.name === '梨形') suggests.push('梨形身材：上半身穿亮色。');
    if (shape.name === '倒三角型') suggests.push('倒三角：避免垫肩。');
  }
  if (sizeType === 'pants'){
    if (g.waist){ const e = g.waist - body.waist; rows.push({ label:'腰围松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,2,5) }); }
    if (g.hip){ const e = g.hip - body.hip; rows.push({ label:'臀围松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,2.5,6) }); }
  }
  if (sizeType === 'shoes'){
    if (g.footLength){ const e = g.footLength - body.footLength; rows.push({ label:'脚长松量', value:(e>0?'+':'')+e.toFixed(1)+' cm', fit:fitEase(e,0.4,0.9) }); }
  }
  const hardTight = rows.filter(r => r.fit.k === 'tight' || r.fit.k === 'loose').length;
  const score = Math.max(0, 100 - alerts.length * 15 - hardTight * 8);
  return { rows, alerts, suggests, score, sizeType };
}

function parseChineseAmount(str){
  const cn = { '零':'0','一':'1','二':'2','两':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9' };
  let s = String(str || '').replace(/[零一二两三四五六七八九]/g, ch => cn[ch] || ch);
  let amount = 0, matched = false;
  const yuanM = s.match(/(\d+(?:\.\d+)?)\s*[块元圆]/);
  if (yuanM) { amount = parseFloat(yuanM[1]); matched = true; }
  if (!matched) { const m = s.match(/(\d+(?:\.\d+)?)/); if (m) { amount = parseFloat(m[1]); matched = true; } }
  return Math.round(amount * 100) / 100;
}
function parseTransactionText(text){
  const t = String(text || '').trim();
  const amount = parseChineseAmount(t);
  let incomeScore = 0, expenseScore = 0;
  INCOME_HINTS.forEach(re => { if (re.test(t)) incomeScore++; });
  EXPENSE_HINTS.forEach(re => { if (re.test(t)) expenseScore++; });
  let type = incomeScore > expenseScore ? 'income' : 'expense';
  let category = type === 'income' ? '其他收入' : '其他';
  // 自定义分类优先匹配
  const custom = getCustomCats(type);
  for (const c of custom){ if (c && t.indexOf(c) >= 0){ category = c; return { type, amount, category, note: t }; } }
  const dict = type === 'income' ? INCOME_CATS : EXPENSE_CATS;
  for (const [cat, re] of dict) { if (re.test(t)) { category = cat; break; } }
  return { type, amount, category, note: t };
}
function getCatList(type){
  const base = (type === 'income' ? INCOME_CATS : EXPENSE_CATS).map(x => x[0]);
  getCustomCats(type).forEach(c => { if (c && base.indexOf(c) < 0) base.push(c); });
  base.push(type === 'income' ? '其他收入' : '其他');
  return base;
}
function csvEscape(v){ const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function getRangeTransactions(){
  const today = todayStr(), ym = today.slice(0,7), list = transactions;
  if (state.exportRange === 'month') return list.filter(t => t.date.startsWith(ym));

  if (state.exportRange === '3months'){ const c = new Date(); c.setMonth(c.getMonth() - 2); const cut = `${c.getFullYear()}-${pad(c.getMonth()+1)}-01`; return list.filter(t => t.date >= cut); }
  return list;
}
function exportCsv(){

// ★ 统一的文本保存：优先原生，其次 Blob 下载
function saveTextFile(content, filename, mime){
  if (window.AndroidFile && typeof AndroidFile.saveFile === 'function'){
    try { AndroidFile.saveFile(String(content), filename, mime || 'text/plain'); return; } catch(e){ console.error(e); }
  }
  try {
    const blob = new Blob(['\ufeff' + content], { type: (mime||'text/plain') + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); try { URL.revokeObjectURL(url); } catch(e){} }, 200);
    toast('已导出：' + filename);
  } catch(err){ toast('导出失败：' + err.message); }
}

function importTransactionsCsv(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv,text/csv,text/comma-separated-values';
  input.style.position = 'fixed';
  input.style.left = '-9999px';
  input.style.top = '-9999px';
  input.style.opacity = '0';
  input.onchange = e => {
    const file = e.target.files[0];
    if (file) doImportCsv(file);
  };
  document.body.appendChild(input);
  input.click();
  setTimeout(() => { try { document.body.removeChild(input); } catch(e){} }, 60000);
}
function doImportCsv(file){
  const reader = new FileReader();
  reader.onload = function(ev){
    try {
      const raw = ev.target.result.replace(/^\ufeff/, '');
      const lines = raw.split(/\r?\n/).filter(l => l.trim());
      if (lines.length < 2) { toast('CSV 文件为空或格式不正确'); return; }
      const parseCsvLine = (line) => {
        const result = []; let cur = '', inQuote = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (inQuote) {
            if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
            else if (ch === '"') inQuote = false;
            else cur += ch;
          } else {
            if (ch === '"') inQuote = true;
            else if (ch === ',') { result.push(cur); cur = ''; }
            else cur += ch;
          }
        }
        result.push(cur); return result;
      };
      const header = parseCsvLine(lines[0]);
      const idxDate   = header.findIndex(h => h.includes('日期') || /date/i.test(h));
      const idxTime   = header.findIndex(h => h.includes('时间') || /time/i.test(h));
      const idxAmount = header.findIndex(h => h.includes('金额') || /amount/i.test(h));
      const idxType   = header.findIndex(h => h.includes('类型') || /type/i.test(h));
      const idxCat    = header.findIndex(h => h.includes('分类') || /category/i.test(h));
      const idxNote   = header.findIndex(h => h.includes('备注') || /note/i.test(h));
      if (idxDate < 0 || idxAmount < 0) { toast('CSV 需至少含"日期"和"金额"列'); return; }
      const existing = new Set(transactions.map(t => `${t.date}|${t.time}|${t.amount}|${t.type}|${t.category}|${t.note}`));
      const customExpense = getCustomCats('expense').slice();
      const customIncome = getCustomCats('income').slice();
      let added = 0, skipped = 0;
      for (let i = 1; i < lines.length; i++) {
        const cols = parseCsvLine(lines[i]);
        const date = (cols[idxDate] || '').trim();
        const amount = parseFloat((cols[idxAmount] || '').trim());
        if (!date || isNaN(amount)) { skipped++; continue; }
        const time = idxTime >= 0 && (cols[idxTime] || '').trim() ? (cols[idxTime] || '').trim() : fmtTime(new Date());
        const typeStr = idxType >= 0 ? (cols[idxType] || '').trim() : '支出';
        const type = (typeStr === '收入' || typeStr === 'income') ? 'income' : 'expense';
        let category = idxCat >= 0 && (cols[idxCat] || '').trim() ? (cols[idxCat] || '').trim() : (type === 'income' ? '其他收入' : '其他');
        const note = idxNote >= 0 ? (cols[idxNote] || '').trim() : '';
        // 保留自定义分类
        const known = getCatList(type);
        if (known.indexOf(category) < 0){
          if (type === 'income'){ if (customIncome.indexOf(category) < 0) customIncome.push(category); }
          else { if (customExpense.indexOf(category) < 0) customExpense.push(category); }
        }
        const sig = `${date}|${time}|${amount}|${type}|${category}|${note}`;
        if (existing.has(sig)) { skipped++; continue; }
        transactions.unshift({ id: Date.now() + Math.floor(Math.random()*1000) + i, date, time, amount, category, note, type });
        existing.add(sig); added++;
      }
      LS.set('app_h_customCats', { expense: customExpense, income: customIncome });
      if (added > 0){
        state.transactions = transactions;
        LS.set('app_h_transactions', transactions);
        render();
        toast(`✓ 新增 ${added} 条，跳过重复 ${skipped} 条`);
      } else { toast(`没有新增记录（跳过重复 ${skipped} 条）`); }
    } catch (err) { console.error(err); toast('导入失败：' + (err.message||'未知')); }
  };
  reader.readAsText(file, 'UTF-8');
}

async function fetchWeather(){
  const el1 = document.getElementById('homeWeather');
  const el2 = document.getElementById('homeTemp');
  if (!el1 || !el2) return;
  try {
    let location = '101010100';
    try {
      const pos = await new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('no geo'));
        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000, maximumAge: 30*60*1000 });
      });
      location = `${pos.coords.longitude.toFixed(2)},${pos.coords.latitude.toFixed(2)}`;
    } catch(e){}
    const url = `https://${APP_DEFAULTS.qweather.host}/v7/weather/now?location=${encodeURIComponent(location)}&key=${APP_DEFAULTS.qweather.key}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.code === '200' && data.now) {
      const iconMap = { 100:'☀️',101:'⛅',102:'⛅',103:'⛅',104:'☁️',300:'🌧️',400:'❄️',500:'🌫️' };
      const icon = iconMap[Math.floor(data.now.icon/100)*100] || '☀️';
      el1.textContent = icon + ' ' + data.now.text;
      el2.textContent = data.now.temp + '℃';
      HealthStore.save('lastWeather', { ts: Date.now(), text: data.now.text, temp: data.now.temp });
      return;
    }
    throw new Error('code '+data.code);
  } catch(e){
    const cached = HealthStore.load('lastWeather', null);
    if (cached){ el1.textContent = '☀️ ' + cached.text; el2.textContent = cached.temp + '℃'; }
    else { el1.textContent = '☀️ 晴'; el2.textContent = '--℃'; }
  }
}

/* ================================================================
   ★★★ TTS：原生优先 → speechSynthesis → 有道在线兜底 ★★★
   ================================================================ */
let _currentSpeakBtn = null;
let _speakSeq = 0;
let _ttsSafetyTimer = null;

function stopSpeak(){
  try { if (window.AndroidTTS && typeof AndroidTTS.stop === 'function') AndroidTTS.stop(); } catch(e){}
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
  try { const p = document.getElementById('ttsPlayer'); if (p){ p.pause(); p.currentTime = 0; } } catch(e){}
  document.querySelectorAll('.playing').forEach(b => b.classList.remove('playing'));
  _currentSpeakBtn = null;
  _speakSeq++;
  if (_ttsSafetyTimer){ clearTimeout(_ttsSafetyTimer); _ttsSafetyTimer = null; }
}

// 原生 TTS 完成回调
window.__onTTSDone = function(uid){
  document.querySelectorAll('.playing').forEach(b => b.classList.remove('playing'));
  _currentSpeakBtn = null;
};
window.__onTTSError = function(uid, msg){
  window.__onTTSDone(uid);
  if (msg) console.warn('TTS error:', msg);
};

function markPlaying(btn, seq){
  if (!btn) return;
  btn.classList.add('playing');
  _currentSpeakBtn = btn;
  if (_ttsSafetyTimer) clearTimeout(_ttsSafetyTimer);
  _ttsSafetyTimer = setTimeout(() => {
    if (seq === _speakSeq){ document.querySelectorAll('.playing').forEach(b => b.classList.remove('playing')); _currentSpeakBtn = null; }
  }, 60000);
}

function toggleSpeak(text, lang, btn){
  if (!text) { toast('没有内容可朗读'); return; }
  const wasPlaying = btn && btn.classList.contains('playing');
  stopSpeak();
  if (wasPlaying) return;

  const langStr = (lang || 'en-US');
  const seq = ++_speakSeq;
  const uid = 'u' + seq + '_' + Date.now();
  const trimmed = String(text).slice(0, 1500);

  // ① 原生 Android TTS —— 最稳，离线可用
  if (window.AndroidTTS && typeof AndroidTTS.speak === 'function'){
    try {
      markPlaying(btn, seq);
      AndroidTTS.speak(trimmed, langStr, uid);
      return;
    } catch(e){ console.error('原生 TTS 失败', e); }
  }

  // ② 浏览器 speechSynthesis
  if (typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined'){
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(trimmed);
      u.lang = langStr;
      u.rate = 0.95;
      u.onend = () => { if (seq === _speakSeq){ document.querySelectorAll('.playing').forEach(b => b.classList.remove('playing')); _currentSpeakBtn = null; } };
      u.onerror = u.onend;
      markPlaying(btn, seq);
      speechSynthesis.speak(u);
      return;
    } catch(e){ console.error('speechSynthesis 失败', e); }
  }

  // ③ 有道在线 TTS 兜底
  const player = document.getElementById('ttsPlayer');
  if (!player) { toast('朗读失败：没有音频播放器'); return; }
  const isZh = langStr.indexOf('zh') === 0;
  const url = isZh
    ? `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(trimmed.slice(0,800))}&le=zh`
    : `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(trimmed.slice(0,800))}&type=2`;
  markPlaying(btn, seq);
  const cleanup = () => { if (seq !== _speakSeq) return; if (_currentSpeakBtn) _currentSpeakBtn.classList.remove('playing'); _currentSpeakBtn = null; };
  player.onended = cleanup;
  player.onerror = () => { cleanup(); toast('朗读失败，请检查网络'); };
  player.src = url;
  const p = player.play();
  if (p && p.catch) p.catch(() => { cleanup(); toast('朗读被拦截，请再点一次'); });
}

function copyText(text){
  return new Promise(resolve => {
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>resolve(true)).catch(()=>resolve(false)); return; }
    try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); document.body.removeChild(ta); resolve(ok); }catch(e){ resolve(false); }
  });
}
function openExternal(url){
  if (!url){ toast('无链接'); return; }
  const u = String(url).trim();
  if (!/^https?:\/\//i.test(u)){ toast('链接不安全'); return; }
  try { const a = document.createElement('a'); a.href = u; a.target='_blank'; a.rel='noopener noreferrer'; a.style.display='none'; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),150); }catch(e){ toast('打开失败'); }
}

  async call(system, user, maxTokens, temp){
    const cfg = this.endpoints()[this.provider];
    if (!cfg) throw new Error('AI 未配置');
    const r = await fetch(cfg.base, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + this.apiKey }, body: JSON.stringify({ model: this.model || cfg.model, messages: [{ role:'system', content:system }, { role:'user', content:user }], temperature: temp == null ? 0.4 : temp, max_tokens: maxTokens || 1000 }) });

  },
  parseJSON(content){
    if (!content) return null;
    let json = content.trim();
    if (json.startsWith('```')) json = json.replace(/^```(?:json)?\s*/, '').replace(/```\s*$/, '');
    const i = json.indexOf('{'), j = json.lastIndexOf('}');
    if (i>=0 && j>i) json = json.slice(i, j+1);
    return JSON.parse(json);

function buildCalendarFromPlans(){

// ★ 字符串/JSON 双解
function coerce(v){
  if (v === null || v === undefined) return v;
  if (typeof v !== 'string') return v;
  let s = v.trim();
  for (let i = 0; i < 3; i++){
    if (!s) return s;
    const looksJson = (s[0] === '{' && s[s.length-1] === '}') || (s[0] === '[' && s[s.length-1] === ']')
      || (s[0] === '"' && s[s.length-1] === '"') || s === 'true' || s === 'false' || /^-?\d+(\.\d+)?$/.test(s);
    if (!looksJson) break;
    try {
      const p = JSON.parse(s);
      if (typeof p === 'string'){ s = p; continue; }
      return p;
    } catch(e){ break; }
  }
  return s;
}

function parseLedgerCsv(raw){
  const lines = String(raw).replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const parseLine = (line) => {
    const out = []; let cur = '', inQuote = false;
    for (let i = 0; i < line.length; i++){
      const ch = line[i];
      if (inQuote){
        if (ch === '"' && line[i+1] === '"'){ cur += '"'; i++; }
        else if (ch === '"') inQuote = false;
        else cur += ch;
      } else {
        if (ch === '"') inQuote = true;
        else if (ch === ','){ out.push(cur); cur = ''; }
        else cur += ch;
      }
    }
    out.push(cur); return out;
  };
  const header = parseLine(lines[0]);
  const idxDate   = header.findIndex(h => h.includes('日期') || /date/i.test(h));
  const idxTime   = header.findIndex(h => h.includes('时间') || /time/i.test(h));
  const idxAmount = header.findIndex(h => h.includes('金额') || /amount/i.test(h));
  const idxType   = header.findIndex(h => h.includes('类型') || /type/i.test(h));
  const idxCat    = header.findIndex(h => h.includes('分类') || /category/i.test(h));
  const idxNote   = header.findIndex(h => h.includes('备注') || /note/i.test(h));
  if (idxDate < 0 || idxAmount < 0) return [];
  const rows = [];
  for (let i = 1; i < lines.length; i++){
    const cols = parseLine(lines[i]);
    const date = (cols[idxDate] || '').trim();
    const amount = parseFloat((cols[idxAmount] || '').trim());
    if (!date || isNaN(amount)) continue;
    const time = idxTime >= 0 && (cols[idxTime] || '').trim() ? (cols[idxTime] || '').trim() : '12:00';
    const typeStr = idxType >= 0 ? (cols[idxType] || '').trim() : '支出';
    const type = (typeStr === '收入' || typeStr === 'income') ? 'income' : 'expense';
    const category = idxCat >= 0 && (cols[idxCat] || '').trim() ? (cols[idxCat] || '').trim() : (type === 'income' ? '其他收入' : '其他');
    const note = idxNote >= 0 ? (cols[idxNote] || '').trim() : '';
    rows.push({ id: Date.now() + Math.floor(Math.random()*100000) + i, date, time, amount, type, category, note });
  }
  return rows;
}

function doImportConfirm(text, fileName){
  const raw = String(text).replace(/^\ufeff/, '');
  const trimmed = raw.trim();

  // ===== 情况 0：CSV 文件 → 直接走账本导入 =====
  if ((fileName && /\.csv$/i.test(fileName)) || (trimmed.indexOf('日期') === 0 || trimmed.indexOf('日期,') >= 0)){
    const rows = parseLedgerCsv(raw);
    if (!rows.length){ toast('CSV 未解析出有效记录'); return; }
    const existing = new Set(transactions.map(t => `${t.date}|${t.time}|${t.amount}|${t.type}|${t.category}|${t.note}`));
    const customExpense = getCustomCats('expense').slice();
    const customIncome = getCustomCats('income').slice();
    let added = 0;
    rows.forEach(r => {
      const known = getCatList(r.type);
      if (known.indexOf(r.category) < 0){
        if (r.type === 'income'){ if (customIncome.indexOf(r.category) < 0) customIncome.push(r.category); }
        else { if (customExpense.indexOf(r.category) < 0) customExpense.push(r.category); }
      }
      const sig = `${r.date}|${r.time}|${r.amount}|${r.type}|${r.category}|${r.note}`;
      if (existing.has(sig)) return;
      transactions.unshift(r); existing.add(sig); added++;
    });
    LS.set('app_h_customCats', { expense: customExpense, income: customIncome });
    state.transactions = transactions;
    LS.set('app_h_transactions', transactions);
    toast(`✓ 导入账本 ${added} 条`);
    setTimeout(() => location.reload(), 700);
    return;
  }

  let d;
  try { d = JSON.parse(trimmed); }
  catch(e){ toast('文件不是有效的 JSON / CSV'); return; }

  let ok = false;

  // ===== 情况 A：纯数组（账本列表）=====
  if (Array.isArray(d)){
    const list = d.filter(x => x && (x.amount !== undefined || x.date)).map(x => ({
      id: x.id || (Date.now() + Math.floor(Math.random()*1000)),
      date: x.date || todayStr(),
      time: x.time || '12:00',
      amount: parseFloat(x.amount) || 0,
      type: (x.type === '收入' || x.type === 'income') ? 'income' : 'expense',
      category: x.category || (x.type === '收入' ? '其他收入' : '其他'),
      note: x.note || x.desc || ''
    }));
    transactions = [...list, ...transactions];
    state.transactions = transactions;
    LS.set('app_h_transactions', transactions);
    toast(`✓ 导入 ${list.length} 条账本`);
    setTimeout(() => location.reload(), 700);
    return;
  }

  // ===== 情况 B：新版全量备份 {app, version, kv} =====
  if (d.kv && typeof d.kv === 'object'){
    let n = 0;
    Object.keys(d.kv).forEach(k => {
      try { localStorage.setItem(k, d.kv[k]); n++; } catch(e){}
    });
    ok = n > 0;
    if (ok) toast(`✓ 已恢复 ${n} 项数据`);
  }

  // ===== 情况 C：旧版 App 备份 {version, app, data:{...}} =====
  if (!ok && d.data && typeof d.data === 'object'){
    let n = 0;
    Object.keys(d.data).forEach(oldKey => {
      const newKey = LEGACY_KEY_MAP[oldKey] || oldKey;
      let val = coerce(d.data[oldKey]);
      // 特殊处理：账本一定写成数组
      if (newKey === 'app_h_transactions' && !Array.isArray(val)) val = [];
      if (newKey === 'app_h_suppLib' && !Array.isArray(val)) val = SUPP_LIB_DEFAULT;
      try { localStorage.setItem(newKey, JSON.stringify(val)); n++; } catch(e){ console.warn('写入失败', newKey, e); }
    });
    // 旧版的补剂列表键名如果没带过来，单独兜底
    if (d.data.app_supplements && !localStorage.getItem('app_h_suppLib')){
      try { localStorage.setItem('app_h_suppLib', JSON.stringify(coerce(d.data.app_supplements))); } catch(e){}
    }
    ok = n > 0;
    if (ok) toast(`✓ 已从旧版备份恢复 ${n} 项`);
  }

  // ===== 情况 D：本 App v1 格式 {learn:{}, health:{}} =====
  if (!ok && (d.learn || d.health)){
    if (d.learn){
      if (d.learn.learned) LS.set('learned:'+DAY, d.learn.learned);
      if (d.learn.wordDeckMap) LS.set('word-deck-map', d.learn.wordDeckMap);
      if (d.learn.schedule){
        if (d.learn.schedule.english) LearnStore.setSchedule('english', d.learn.schedule.english);
        if (d.learn.schedule.work) LearnStore.setSchedule('work', d.learn.schedule.work);
      }
      if (d.learn.wrongBook) LS.set('wrong-book', d.learn.wrongBook);
      if (d.learn.streak) LS.set('streak', d.learn.streak);
      if (d.learn.aiHistory) LS.set('ai-history', d.learn.aiHistory);
    }
    const h = d.health || d;
    if (h.body) HealthStore.save('body', h.body);
    if (h.suppLib || h.supplements) { suppLib = h.suppLib || h.supplements; saveSuppLib(); }
    if (h.profile) HealthStore.save('profile', h.profile);
    if (h.skinState) HealthStore.save('skinState', h.skinState);
    if (Array.isArray(h.transactions)) LS.set('app_h_transactions', h.transactions.concat(LS.get('app_h_transactions', [])));
    if (Array.isArray(h.clothes)) LS.set('app_h_clothes', h.clothes);
    if (h.skinProducts) HealthStore.save('skinProducts', h.skinProducts);
    if (h.planStart) LS.set('app_h_planStartDate', h.planStart);
    if (h.overrides) LS.set('app_h_planOverrides', h.overrides);
    if (h.manualTodos) LS.set('app_h_calendarManual', h.manualTodos);
    if (h.todoStatus) LS.set('app_h_todoStatus', h.todoStatus);
    if (h.sportSessions) LS.set('app_h_sportSessions', h.sportSessions);
    if (h.bodyHistory) LS.set('app_h_bodyHistory', h.bodyHistory);
    ok = true;
    toast('✓ 已从 v1 备份恢复');
  }

  // ===== 情况 E：直接就是一份"键值对"对象（无 data 包裹）=====
  if (!ok && (d.app_body || d.transactions || d.dailyChecks || d.app_supplements)){
    let n = 0;
    Object.keys(d).forEach(k => {
      const newKey = LEGACY_KEY_MAP[k] || k;
      if (!/^(app_|dailyChecks|planStartDate|planOverrides|todoStatus|calendarManual|sportSessions|transactions|clothes|skinProducts|last_)/.test(newKey)) return;
      const val = coerce(d[k]);
      try { localStorage.setItem(newKey, JSON.stringify(val)); n++; } catch(e){}
    });
    ok = n > 0;
    if (ok) toast(`✓ 已恢复 ${n} 项`);
  }

  if (!ok){ toast('未识别的文件格式'); return; }
  setTimeout(() => location.reload(), 800);
}

function clearAllData(){
  if (!confirm('确定清空？所有学习、健康数据将丢失。')) return;
  const prefixes = ['learned:', 'know-done:', 'passage-done:', 'news-think-', 'news-done:', 'quote-done:', 'story-done:', 'yiyan-done:', 'general-done:', 'expr-done:', 'note:', 'ask-cache:', 'ask-text:', 'think-ans:', 'think-done-days:', 'expr-ans:', 'expr-grade:', 'today-words:', 'schedule:', 'cache:', 'weekly-result:', 'alltest-result', 'ai-', 'streak', 'app_h_'];
  try { Object.keys(localStorage).forEach(k => { if (prefixes.some(p => k.startsWith(p))) localStorage.removeItem(k); }); } catch(e){}
  toast('已清空');
  setTimeout(() => location.reload(), 500);
}

let searchTimer = null;
view.addEventListener('input', e => {
  const el = e.target; if (!el) return;
  if (el.id === 'valveSearch'){
    const val = el.value, pos = el.selectionStart; state.searchQuery = val;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => { await render({ keepScroll: true }); const n = document.getElementById('valveSearch'); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(e){} } }, 200);
    return;
  }
  if (el.dataset && el.dataset.noteQ){ LearnStore.setNote(el.dataset.noteQ, el.value); return; }
  if (el.dataset && el.dataset.qaQ){ LS.set('ask-text:'+el.dataset.qaQ, el.value); return; }
  if (el.dataset && el.dataset.newsThink){ LS.set(el.dataset.newsThink, el.value); return; }
  if (el.dataset && el.dataset.thinkAns){ LearnStore.setThinkAns(el.dataset.thinkAns, el.value); return; }
});

view.addEventListener('click', async e => {

  if (act === 'copyText'){ copyText(t.dataset.text).then(ok => toast(ok?'已复制':'复制失败')); return; }
  if (act === 'openNews'){ openExternal(t.dataset.url); return; }
  if (act === 'openAI'){ openAIAssistant(); return; }
  if (act === 'closeCenterTimer'){ finishWalkTimer(); return; }
  if (act === 'startRest'){ startRestTimer(t.dataset.code, parseInt(t.dataset.sec, 10)); return; }
  if (act === 'gotoBodyData'){ state.tab = 'life'; state.lifeSub = 'sport'; state.sportSub = 'body'; render(); return; }
  if (act === 'setOverride'){
    const mode = t.dataset.mode;
    const today = new Date(); today.setHours(0,0,0,0);
    setOverride(today, mode === 'original' ? null : mode);
    buildCalendarFromPlans();
    render({ keepScroll: true });
    toast(mode === 'original' ? '已恢复为正常状态' : '已切换身体状态');
    return;
  }

  if (act === 'studySub'){ state.studySub = t.dataset.sub; render(); return; }
  if (act === 'englishSub'){ state.englishSub = t.dataset.sub; state.englishPage = 1; render(); return; }
  if (act === 'englishDeck'){ state.englishDeck = t.dataset.deck; LS.set('english-deck', state.englishDeck); state.englishPage = 1; render(); return; }
  if (act === 'englishLoadMore'){ state.englishPage += 1; render(); return; }
  if (act === 'valveLoadMore'){ state.valvePage += 1; render(); return; }
  if (act === 'taskJump'){
    const key = t.dataset.key;
    if (key === 'words'){ state.studySub = 'english'; state.englishSub = 'today'; }
    else if (key === 'valve') state.studySub = 'valve';
    else if (key === 'logic') state.studySub = 'logic';
    else if (key === 'general') state.studySub = 'general';
    else if (['passage','expr','yiyan','quote','story'].includes(key)){ state.tab = 'discover'; state.discoverSub = 'express'; }
    else if (key === 'news'){ state.tab = 'discover'; state.discoverSub = 'news'; }
    render(); return;
  }
  if (act === 'learnWord'){
    const card = t.closest('[data-word]'); if (!card) return;
    const w = card.dataset.word; const deck = card.dataset.deck;
    const learned = LearnStore.getLearned(); const i = learned.indexOf(w);
    if (i < 0){ learned.push(w); LearnStore.ensureSchedule('english', w); if (deck) LearnStore.setWordDeck(w, deck); }
    else learned.splice(i, 1);
    LearnStore.setLearned(learned); render({ keepScroll: true });
    toast(i < 0 ? '已标记为已学' : '已取消'); return;
  }
  if (act === 'knowToggle'){ const card = t.closest('.know'); const q = card ? card.dataset.q : null; if (!q) return; state.openKnow = state.openKnow === q ? null : q; render({ keepScroll: true }); return; }
  if (act === 'knowDone'){
    e.stopPropagation(); const card = t.closest('.know'); const q = card ? card.dataset.q : null; if (!q) return;
    const done = LearnStore.getKnowDone(); const i = done.indexOf(q);
    if (i < 0){ done.push(q); LearnStore.ensureSchedule('work', q); } else done.splice(i, 1);
    LearnStore.setKnowDone(done); toast(i < 0 ? '已标记掌握' : '已取消'); render({ keepScroll: true }); return;
  }
  if (act === 'thinkToggle'){ const card = t.closest('.know'); const name = card ? card.dataset.think : null; if (!name) return; state.openThink = state.openThink === name ? null : name; render({ keepScroll: true }); return; }
  if (act === 'thinkDone'){ e.stopPropagation(); LearnStore.markThinkDone(t.dataset.name); toast('已记录'); render({ keepScroll: true }); return; }
  if (act === 'valveCat'){ state.valveCat = t.dataset.cat; state.searchQuery = ''; state.openKnow = null; state.valvePage = 1; render(); return; }
  if (act === 'searchClear'){ state.searchQuery = ''; render(); return; }
  if (act === 'markGeneralDone'){ LS.set('general-done:'+DAY, true); toast('已记录'); render({ keepScroll: true }); return; }
  if (act === 'refreshGeneral'){ state.generalData = null; CacheStore.save(CACHE_KEY_KNOWLEDGE, null); render({ keepScroll: true }); return; }
  if (act === 'markYiyanDone'){ LS.set('yiyan-done:'+DAY, true); toast('已记录'); render({ keepScroll: true }); return; }

  if (act === 'refreshJoke'){ state.jokeResults = []; CacheStore.save('joke-results', null); render({ keepScroll: true }); return; }
  if (act === 'refreshNews'){ state.newsResults = []; CacheStore.save('news-all', null); render({ keepScroll: true }); return; }
  if (act === 'togglePassage'){ state.passageHidden = !state.passageHidden; render({ keepScroll: true }); return; }
  if (act === 'recCat'){ state.recommendCat = t.dataset.cat; state.recData = null; render({ keepScroll: true }); return; }
  if (act === 'discoverSub'){ state.discoverSub = t.dataset.sub; render(); return; }
  if (act === 'startWeeklyTest'){ startWeeklyTest(); return; }
  if (act === 'startAllTest'){ startAllTest(); return; }
  if (act === 'startReview'){
    e.stopPropagation(); const type = t.dataset.type;
    if (type === 'english'){ toast('加载中…'); try { await DeckLoader.ensureForReview(); } catch(err){} const keys = LearnStore.getReviewList('english', REVIEW_TARGET); const list = keys.map(k => DeckLoader.findWord(k)).filter(Boolean); if (!list.length){ toast('还没有学过的单词'); return; } startReview(type, list); }
    else { const keys = LearnStore.getReviewList('work', REVIEW_TARGET); const list = keys.map(k => SEED.VALVE_ALL.find(v => v.q === k)).filter(Boolean); if (!list.length){ toast('还没有学过的知识'); return; } startReview(type, list); }
    return;
  }
  if (act === 'askAbout'){
    e.stopPropagation(); const q = t.dataset.q;
    const card = t.closest('.know') || t.closest('.card'); if (!card) return;
    const input = card.querySelector('[data-qa-q]'); const question = (input && input.value || '').trim();
    if (!question){ toast('先输入问题'); return; }
    if (!AI.enabled()){ toast('请先配置 AI'); return; }
    LS.set('ask-text:'+q, question); state.aiAnsweringFor = q; state.aiLoading = true; render({ keepScroll: true });
    try { const item = SEED.VALVE_ALL.find(v => v.q === q); const ctx = item ? `${item.cat}：${item.a} ${item.key}` : ''; const answer = await AI.answerQuestion(question, ctx); LS.set('ask-cache:'+q, { question, answer: answer||'（无返回）', t: Date.now() }); toast('AI 已解答'); } catch(err){ LS.set('ask-cache:'+q, { question, answer: '调用失败：'+(err.message||'未知'), t: Date.now() }); toast('调用失败'); }
    state.aiLoading = false; state.aiAnsweringFor = null; render({ keepScroll: true }); return;
  }
  if (act === 'gradeAnswer'){
    e.stopPropagation(); const scene = t.dataset.scene, q = t.dataset.q, guide = t.dataset.guide;

    try { const result = await AI.gradeExpression(scene, q, guide, answer); if (result){ LS.set('expr-grade:'+key, result); LS.set('expr-done:'+todayStr(), true); if (resultEl) resultEl.innerHTML = renderGradeCard(result); updateTopbar(); toast('评分完成'); } }
    catch(err){ if (resultEl) resultEl.innerHTML = renderGradeCard({ error:'调用失败：'+(err.message||'未知') }); }
    finally { t.disabled = false; t.textContent = '🔄 重新评分'; }

  if (act === 'moneySub'){ state.moneySub = t.dataset.sub; render(); return; }
  if (act === 'sportSub'){ state.sportSub = t.dataset.sub; render(); return; }
  if (act === 'closetSub'){ state.closetSub = t.dataset.sub; render(); return; }
  if (act === 'careSub'){ state.careSub = t.dataset.sub; render(); return; }

  if (act === 'prevMonth'){ state.calMonth--; if (state.calMonth < 0){ state.calMonth = 11; state.calYear--; } HealthStore.save('calMonth', state.calMonth); HealthStore.save('calYear', state.calYear); render(); return; }
  if (act === 'nextMonth'){ state.calMonth++; if (state.calMonth > 11){ state.calMonth = 0; state.calYear++; } HealthStore.save('calMonth', state.calMonth); HealthStore.save('calYear', state.calYear); render(); return; }
  if (act === 'backToToday'){ const now = new Date(); state.calYear = now.getFullYear(); state.calMonth = now.getMonth(); state.selectedDate = todayStr(); render(); return; }
  if (act === 'newTodo'){
    const date = prompt('日期（YYYY-MM-DD）', state.selectedDate); if (!date) return;
    const time = prompt('时间（如 09:00）', '09:00') || '09:00';
    const title = prompt('事项'); if (!title) return;

    if (!saved[date]) saved[date] = [];
    saved[date].push({ time, title, desc, done:false });
    saveManualTodos(saved);
    render(); return;
  }

  if (act === 'toggleManual'){ const a = document.getElementById('textInputArea'); if (a) a.classList.toggle('show'); return; }
  if (act === 'parseManual'){
    const v = document.getElementById('manualTxInput').value.trim();
    if (!v){ toast('请输入文字'); return; }
    state.pendingTx = parseTransactionText(v);
    renderTxEditor();
    return;
  }
  if (act === 'setExportRange'){ state.exportRange = t.dataset.range; HealthStore.save('exportRange', state.exportRange); render({ keepScroll: true }); return; }
  if (act === 'exportCsv'){ exportCsv(); return; }
  if (act === 'importTxCsv'){ importTransactionsCsv(); return; }

    if (!state.pendingTx) return;
    state.pendingTx.type = t.dataset.t;
    if (getCatList(state.pendingTx.type).indexOf(state.pendingTx.category) < 0) state.pendingTx.category = state.pendingTx.type === 'income' ? '其他收入' : '其他';

  if (act === 'cancelTx'){ state.pendingTx = null; renderTxEditor(); return; }

    if (!amt || amt <= 0){ toast('请输入有效金额'); return; }
    const noteEl = document.getElementById('txNote');
    const note = noteEl ? noteEl.value.trim() : '';
    if (state.pendingTx.editingId){

      if (tx){ tx.amount = amt; tx.category = state.pendingTx.category; tx.note = note; tx.type = state.pendingTx.type; }
    } else {
      transactions.unshift({ id: Date.now()+Math.floor(Math.random()*1000), date: todayStr(), time: fmtTime(new Date()), amount: amt, category: state.pendingTx.category, note: note || state.pendingTx.note, type: state.pendingTx.type });
    }
    state.transactions = transactions;
    LS.set('app_h_transactions', transactions);
    state.pendingTx = null;
    toast('已保存');
    render(); return;
  }

  if (act === 'startSport'){
    const t0 = document.getElementById('sportStartTime');
    const label = (t0 && t0.value) || fmtTime(new Date());
    const [h, m] = label.split(':').map(Number);

let _voiceActive = false;
let _webRec = null;
let _xunfeiActive = false;

function setMicUI(listening, hintText){
  const mic = document.getElementById('micBtn');
  if (mic){ if (listening) mic.classList.add('listening'); else mic.classList.remove('listening'); }
  const hint = document.getElementById('micHint');

}

function applyVoiceResult(text){
  const v = String(text || '').trim();
  if (!v) return;
  state.pendingTx = parseTransactionText(v);
  const onMoney = (state.tab === 'life' && state.lifeSub === 'money' && state.moneySub === 'record');
  if (!onMoney){

    render().then(() => { renderTxEditor(); scrollToTxEditor(); }).catch(() => {});
  } else {

  }
  toast('已识别：' + v.slice(0, 24));
}

// 原生语音识别回调
window.__onSpeechResult = function(text, isFinal){
  const hint = document.getElementById('micHint');
  if (hint && text) hint.textContent = text;
  if (isFinal){
    _voiceActive = false;
    setMicUI(false, '点击麦克风开始语音输入');
    applyVoiceResult(text);
  }
};
window.__onSpeechEnd = function(){
  if (!_voiceActive) return;
  _voiceActive = false;
  setMicUI(false, '点击麦克风开始语音输入');
};
window.__onSpeechError = function(msg){
  _voiceActive = false;
  setMicUI(false, '点击麦克风开始语音输入');
  if (msg && msg !== 'no-speech' && msg !== 'client') toast('识别失败：' + msg);
};

function startWebSpeech(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return false;
  try {
    _webRec = new SR();
    _webRec.lang = 'zh-CN';
    _webRec.continuous = false;
    _webRec.interimResults = true;
    let finalText = '';
    _webRec.onresult = (ev) => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++){
        const res = ev.results[i];
        if (res.isFinal) finalText += res[0].transcript;
        else interim += res[0].transcript;
      }
      const hint = document.getElementById('micHint');
      if (hint) hint.textContent = finalText || interim;
    };
    _webRec.onerror = (ev) => {
      _voiceActive = false; setMicUI(false, '点击麦克风开始语音输入');
      if (ev.error !== 'no-speech' && ev.error !== 'aborted') toast('识别失败：' + ev.error);
    };
    _webRec.onend = () => {
      _voiceActive = false; setMicUI(false, '点击麦克风开始语音输入');
      if (finalText) applyVoiceResult(finalText);
    };
    _webRec.start();
    return true;
  } catch(e){ console.warn('Web Speech 启动失败', e); return false; }
}

function startVoiceInput(){
  if (_voiceActive){
    // 再次点击 → 停止
    _voiceActive = false;
    try { if (window.AndroidSTT && AndroidSTT.stop) AndroidSTT.stop(); } catch(e){}
    try { if (_webRec) _webRec.stop(); } catch(e){}
    if (_xunfeiActive) stopXunfeiRecognition();
    setMicUI(false, '点击麦克风开始语音输入');
    return;
  }

  // ① 原生 Android 语音识别
  if (window.AndroidSTT && typeof AndroidSTT.start === 'function'){
    try {
      _voiceActive = true;
      setMicUI(true, '正在聆听…（再次点击结束）');
      AndroidSTT.start('zh-CN');
      return;
    } catch(e){ console.error('原生 STT 失败', e); }
  }

  // ② Web Speech API
  if (window.SpeechRecognition || window.webkitSpeechRecognition){
    _voiceActive = true;
    setMicUI(true, '正在聆听…（再次点击结束）');
    if (startWebSpeech()) return;
    _voiceActive = false;
  }

  // ③ 讯飞 WebSocket
  setMicUI(true, '正在聆听…（再次点击结束）');
  startXunfeiRecognition();
}

// ---------- 讯飞 WebSocket 语音识别（兜底） ----------
const XUNFEI_CONFIG = {
  APPID: "4c627b59",
  API_SECRET: "YzI1MDJmYWM0NTliNzNkMjl3NGIyM2Uz",
  API_KEY: "2fbffaacd145309be7c024db99e9c7ef",
  HOST: "iat-api.xfyun.cn",
  PATH: "/v2/iat"
};
let xunfeiSocket = null, audioContext = null, mediaStream = null, processor = null, isRecording = false;

async function getWebSocketUrl() {
  const date = new Date().toUTCString();
  const signatureOrigin = `host: ${XUNFEI_CONFIG.HOST}\ndate: ${date}\nGET ${XUNFEI_CONFIG.PATH} HTTP/1.1`;
  const enc = new TextEncoder();
  if (!crypto || !crypto.subtle) throw new Error('crypto.subtle 不可用（页面可能不是 https）');
  const key = await crypto.subtle.importKey('raw', enc.encode(XUNFEI_CONFIG.API_SECRET), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sigBuf = await crypto.subtle.sign('HMAC', key, enc.encode(signatureOrigin));
  const signature = btoa(String.fromCharCode(...new Uint8Array(sigBuf)));
  const authorizationOrigin = `api_key="${XUNFEI_CONFIG.API_KEY}", algorithm="hmac-sha256", headers="host date request-line", signature="${signature}"`;
  const authorization = btoa(authorizationOrigin);
  return `wss://${XUNFEI_CONFIG.HOST}${XUNFEI_CONFIG.PATH}?authorization=${authorization}&date=${encodeURIComponent(date)}&host=${XUNFEI_CONFIG.HOST}`;
}
async function startXunfeiRecognition(){
  if (isRecording) return;
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true } });
    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const source = audioContext.createMediaStreamSource(mediaStream);
    processor = audioContext.createScriptProcessor(4096, 1, 1);
    const wsUrl = await getWebSocketUrl();
    xunfeiSocket = new WebSocket(wsUrl);
    xunfeiSocket.onopen = () => {
      isRecording = true; _xunfeiActive = true; _voiceActive = true;
      setMicUI(true, '正在聆听…（再次点击结束）');
      xunfeiSocket.send(JSON.stringify({ common: { app_id: XUNFEI_CONFIG.APPID }, business: { language: 'zh_cn', domain: 'iat', accent: 'mandarin', vad_eos: 3000, dwa: 'wpgs' }, data: { status: 0, format: 'audio/L16;rate=16000', encoding: 'raw' } }));
      processor.onaudioprocess = (e) => {
        if (!isRecording) return;
        const inputData = e.inputBuffer.getChannelData(0);
        const pcmData = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) pcmData[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
        const uint8Array = new Uint8Array(pcmData.buffer);
        let binary = '';
        for (let i = 0; i < uint8Array.length; i++) binary += String.fromCharCode(uint8Array[i]);
        const base64Data = btoa(binary);
        if (xunfeiSocket.readyState === WebSocket.OPEN) xunfeiSocket.send(JSON.stringify({ data: { status: 1, format: 'audio/L16;rate=16000', encoding: 'raw', audio: base64Data } }));
      };
      source.connect(processor); processor.connect(audioContext.destination);
    };
    let resultText = '';
    xunfeiSocket.onmessage = (e) => {
      const res = JSON.parse(e.data);
      if (res.code !== 0){ console.error('讯飞错误:', res); toast('识别错误 code=' + res.code); return; }
      if (res.data && res.data.result){
        let text = res.data.result.ws.map(w => w.cw.map(c => c.w).join('')).join('');
        if (res.data.result.pgs === 'rpl') resultText = resultText.slice(0, -res.data.result.rg[0]) + text;
        else resultText += text;
        const hint = document.getElementById('micHint');
        if (hint) hint.textContent = resultText;
      }
      if (res.data && res.data.status === 2){
        stopXunfeiRecognition();
        if (resultText.trim()) applyVoiceResult(resultText.trim());
      }
    };
    xunfeiSocket.onerror = (err) => { console.error('WS 错误', err); stopXunfeiRecognition(); toast('语音识别网络错误'); };
    xunfeiSocket.onclose = () => { if (isRecording) stopXunfeiRecognition(); };
  } catch(err){
    console.error(err);
    toast('无法访问麦克风：' + (err.message || err));
    _voiceActive = false; _xunfeiActive = false;
    setMicUI(false, '点击麦克风开始语音输入');
  }
}
function stopXunfeiRecognition(){
  isRecording = false; _xunfeiActive = false;
  if (processor){ try { processor.disconnect(); } catch(e){} processor = null; }
  if (audioContext){ try { audioContext.close(); } catch(e){} audioContext = null; }
  if (mediaStream){ mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  if (xunfeiSocket && xunfeiSocket.readyState === WebSocket.OPEN){
    try { xunfeiSocket.send(JSON.stringify({ data: { status: 2, format: 'audio/L16;rate=16000', encoding: 'raw', audio: '' } })); } catch(e){}
    setTimeout(() => { try { if (xunfeiSocket) xunfeiSocket.close(); } catch(e){} xunfeiSocket = null; }, 500);
  } else xunfeiSocket = null;
  setMicUI(false, '点击麦克风开始语音输入');
}

  openSheet(`<div class="sheet-head"><div class="sheet-emoji">🔍</div><div style="flex:1;min-width:0;"><h2>全局搜索</h2></div></div><div style="display:flex;gap:8px;align-items:center;background:#f8f9fd;border-radius:12px;padding:10px 14px;margin:14px 0;"><span style="font-size:15px;opacity:.5;">🔍</span><input id="globalSearchInput" placeholder="输入关键词…" style="flex:1;border:0;background:transparent;font-size:15px;outline:0;"></div><div id="globalSearchResults" style="max-height:60vh;overflow-y:auto;"></div>`);
  setTimeout(() => {
    const input = document.getElementById('globalSearchInput');
    if (input){
      input.focus();
      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        const el = document.getElementById('globalSearchResults');
        if (!q){ el.innerHTML = ''; return; }
        const results = [];
        SEED.VALVE_ALL.forEach(v => { if (v.q.toLowerCase().includes(q) || v.a.toLowerCase().includes(q)) results.push({ type:'valve', label:'知识', q:v.q, snip:v.a.slice(0,80) }); });
        Object.keys(DeckLoader.loaded).forEach(id => { (DeckLoader.loaded[id]||[]).forEach(w => { if (w.w.toLowerCase().includes(q) || (w.cn||'').includes(input.value)) results.push({ type:'word', label:'单词', q:w.w, snip:(w.cn||'') }); }); });
        el.innerHTML = results.slice(0,50).map(r => `<div style="padding:12px 4px;border-bottom:1px solid #f0f1f6;"><span style="display:inline-block;font-size:10.5px;font-weight:750;padding:2px 7px;border-radius:5px;margin-bottom:6px;background:${r.type==='valve'?'#eef0ff':'#ecfdf5'};color:${r.type==='valve'?'#4f46e5':'#047857'};">${r.label}</span><div style="font-size:14px;font-weight:650;line-height:1.5;margin-bottom:4px;">${esc(r.q)}</div><div style="font-size:12.5px;color:var(--sub);line-height:1.6;">${esc(r.snip)}</div></div>`).join('') || `<div style="text-align:center;padding:20px;font-size:12.5px;color:var(--sub);">没有找到</div>`;
      });
    }
  }, 100);
});

// ---------- 久坐提醒 ----------
const WALK_LAST_KEY = 'app_h_lastWalkReminder';
let _walkTimerHandle = null, _walkCountdownHandle = null, _walkEndTs = 0;
function isInWalkWindow(){ const now = new Date(); const mins = now.getHours() * 60 + now.getMinutes(); return (mins >= 8*60 + 30 && mins <= 11*60 + 30) || (mins >= 13*60 + 30 && mins <= 17*60); }
function vibratePattern(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }
function speakText(text){ const t = String(text || ''); if (!t) return; try { if (window.AndroidTTS && typeof AndroidTTS.speak === 'function') { AndroidTTS.speak(t, 'zh-CN', 'walk' + Date.now()); return; } if (typeof speechSynthesis !== 'undefined'){ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'zh-CN'; u.rate = 1.0; speechSynthesis.speak(u); } } catch(e){} }
function requestNotifPermission(){ try { if (typeof Notification === 'undefined') return; if (Notification.permission === 'default') Notification.requestPermission(); } catch(e){} }
function showWalkNotification(){ try { if (typeof Notification === 'undefined') return; if (Notification.permission !== 'granted') return; const n = new Notification('该站起来走动了', { body: '起身 → 走动 2–3 分钟 → 下巴轻收 5 次', tag: 'walk-reminder-' + Math.floor(Date.now() / 30000) }); setTimeout(() => { try { n.close(); } catch(e){} }, 30000); } catch(e){} }
function finishWalkTimer(){ const el = document.getElementById('centerTimer'); if (el) el.classList.remove('show'); if (_walkCountdownHandle){ clearInterval(_walkCountdownHandle); _walkCountdownHandle = null; } _walkEndTs = 0; try { playBeep(); } catch(e){} setTimeout(() => { try { playBeep(); } catch(e){} }, 420); vibratePattern([300, 150, 300]); setTimeout(() => speakText('时间到，回到座位继续吧'), 500); }
function startWalkTimer(sec){ const el = document.getElementById('centerTimer'); const num = document.getElementById('centerTimerNum'); if (!el || !num) return; const duration = Math.max(1, parseInt(sec, 10) || 200); _walkEndTs = Date.now() + duration * 1000; num.textContent = duration; el.classList.add('show'); if (_walkCountdownHandle) clearInterval(_walkCountdownHandle); _walkCountdownHandle = setInterval(() => { const left = Math.max(0, Math.ceil((_walkEndTs - Date.now()) / 1000)); num.textContent = left; if (left <= 0) finishWalkTimer(); }, 250); speakText('开始动一动'); vibratePattern([150]); }
function checkWalkReminder(force){ if (!force && !isInWalkWindow()) return; const last = parseInt(LS.get(WALK_LAST_KEY, '0') || '0', 10); const now = Date.now(); if (!force && now - last < 30 * 60 * 1000) return; LS.set(WALK_LAST_KEY, now); if (!_walkEndTs || _walkEndTs < now) startWalkTimer(200); showWalkNotification(); }
function initWalkReminder(){ requestNotifPermission(); setTimeout(() => checkWalkReminder(false), 3000); if (_walkTimerHandle) clearInterval(_walkTimerHandle); _walkTimerHandle = setInterval(() => checkWalkReminder(false), 60 * 1000); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkWalkReminder(false); }); }

// ---------- 初始化 ----------
(function init(){
  loadDataFromGlobals();
  buildCalendarFromPlans();
  LearnStore.checkIn();
  render();
  initWalkReminder();
  setInterval(() => {
    const el = document.getElementById('sportTimer');
    if (el){
      const sess = getSportSession();
      if (sess && !sess.endTs){
        const total = Math.floor((Date.now() - sess.startTs) / 1000);
        const h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
        el.textContent = h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
        const sc = document.getElementById('sportSetCount');
        if (sc) sc.textContent = Object.values(sess.sets || {}).reduce((a,b) => a + b.length, 0);
      }
    }
  }, 1000);
})();
</script>
